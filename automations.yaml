- id: '1777121561066'
  alias: PV Boiler laden
  description: Schaltet den Boiler ein, wenn der Saldierungszaehler fuer 2 Minuten
    genuegend Rueckspeisung zeigt.
  triggers:
  - value_template: '{{ states(''sensor.leistung_saldierung'') | float(0) < ((states(''input_number.boiler_leistung'')
      | float(2300) + states(''input_number.boiler_reserveleistung'') | float(70))
      * -1) }}'
    for:
      minutes: 2
    trigger: template
  conditions:
  - condition: state
    entity_id: input_boolean.boiler_pv_automatik
    state: 'on'
  - condition: state
    entity_id: switch.haus_verbauch
    state: 'off'
  - condition: template
    value_template: '{{ states(''sensor.ww_mitte_rl_ist_ww_oben_temperatur_3'') |
      float(999) < states(''input_number.boiler_wiedereinschalttemperatur'') | float(60)
      }}'
  actions:
  - target:
      entity_id: switch.haus_verbauch
    action: switch.turn_on
  mode: single
- id: boiler_pv_ueberschuss_ausschalten
  alias: PV Boiler ausschalten
  description: Schaltet den Boiler aus, wenn nach Mindestlaufzeit fuer 2 Minuten nicht
    mehr genug Rueckspeisung vorhanden ist.
  triggers:
  - value_template: '{{ states(''sensor.leistung_saldierung'') | float(0) > (states(''input_number.boiler_reserveleistung'')
      | float(70) * -1) }}'
    for:
      minutes: 2
    trigger: template
  conditions:
  - condition: state
    entity_id: input_boolean.boiler_pv_automatik
    state: 'on'
  - condition: state
    entity_id: switch.haus_verbauch
    state: 'on'
  - condition: template
    value_template: '{% set changed = states.switch.haus_verbauch.last_changed %}
      {% set min_runtime = states(''input_number.boiler_mindestlaufzeit'') | float(10)
      %} {{ (now() - changed).total_seconds() >= min_runtime * 60 }}'
  actions:
  - target:
      entity_id: switch.haus_verbauch
    action: switch.turn_off
  mode: single
- id: boiler_pv_automatik_deaktiviert_ausschalten
  alias: PV Boiler Automatik deaktiviert
  description: Schaltet den Boiler aus, wenn die PV-Boiler-Automatik deaktiviert wird.
  triggers:
  - to: 'off'
    entity_id: input_boolean.boiler_pv_automatik
    trigger: state
  conditions:
  - condition: state
    entity_id: switch.haus_verbauch
    state: 'on'
  actions:
  - target:
      entity_id: switch.haus_verbauch
    action: switch.turn_off
  mode: single
- id: boiler_ladezeit_heute_zaehlen
  alias: Boiler Statistik zaehlen
  description: Zaehlt pro laufender Minute Ladezeit, kWh und Durchschnittswerte ab
    Statistikstart.
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions:
  - condition: state
    entity_id: switch.haus_verbauch
    state: 'on'
  actions:
  - variables:
      tage: '{{ [1, (((as_timestamp(now()) - as_timestamp(states(''input_datetime.boiler_statistik_start'')))
        / 86400) | int + 1)] | max }}'
      kwh_minute: '{{ (states(''input_number.boiler_leistung'') | float(2300)) / 1000
        / 60 }}'
      kwh_heute_neu: '{{ (states(''input_number.boiler_kapazitaet_heute'') | float(0))
        + (kwh_minute | float(0)) }}'
      monat_stunden_neu: '{{ (states(''input_number.boiler_ladezeit_monat'') | float(0))
        + (1 / 60) }}'
      ladezeit_heute_neu: '{{ (states(''input_number.boiler_ladezeit_heute'') | float(0))
        + 1 }}'
      total_kwh_neu: '{{ (states(''input_number.boiler_kapazitaet_total'') | float(0))
        + (kwh_minute | float(0)) }}'
      total_stunden_neu: '{{ (states(''input_number.boiler_ladezeit_total'') | float(0))
        + (1 / 60) }}'
      monat_kwh_neu: '{{ (states(''input_number.boiler_kapazitaet_monat'') | float(0))
        + (kwh_minute | float(0)) }}'
  - data:
      value: '{{ ladezeit_heute_neu | round(0) }}'
    target:
      entity_id: input_number.boiler_ladezeit_heute
    action: input_number.set_value
  - data:
      value: '{{ kwh_heute_neu | round(3) }}'
    target:
      entity_id: input_number.boiler_kapazitaet_heute
    action: input_number.set_value
  - data:
      value: '{{ total_stunden_neu | round(2) }}'
    target:
      entity_id: input_number.boiler_ladezeit_total
    action: input_number.set_value
  - data:
      value: '{{ total_kwh_neu | round(3) }}'
    target:
      entity_id: input_number.boiler_kapazitaet_total
    action: input_number.set_value
  - data:
      value: '{{ monat_stunden_neu | round(2) }}'
    target:
      entity_id: input_number.boiler_ladezeit_monat
    action: input_number.set_value
  - data:
      value: '{{ monat_kwh_neu | round(3) }}'
    target:
      entity_id: input_number.boiler_kapazitaet_monat
    action: input_number.set_value
  - data:
      value: '{{ (total_stunden_neu | float(0) / tage | float(1)) | round(2) }}'
    target:
      entity_id: input_number.boiler_durchschnitt_ladezeit_pro_tag
    action: input_number.set_value
  - data:
      value: '{{ (total_kwh_neu | float(0) / tage | float(1)) | round(3) }}'
    target:
      entity_id: input_number.boiler_durchschnitt_kapazitaet_pro_tag
    action: input_number.set_value
  mode: single
- id: boiler_ladezeit_heute_reset
  alias: Boiler Tageswerte reset
  description: Setzt taegliche Boiler-Ladezeit und Tages-kWh um Mitternacht zurueck.
    Die Historie bleibt im Recorder abrufbar.
  triggers:
  - trigger: time
    at: 00:00:00
  conditions: []
  actions:
  - data:
      value: 0
    target:
      entity_id: input_number.boiler_ladezeit_heute
    action: input_number.set_value
  - data:
      value: 0
    target:
      entity_id: input_number.boiler_kapazitaet_heute
    action: input_number.set_value
  mode: single
- id: boiler_maximaltemperatur_erreicht_ausschalten
  alias: Boiler Maximaltemperatur erreicht
  description: Schaltet den Boiler aus, sobald WW-Oben die eingestellte Maximaltemperatur
    erreicht.
  triggers:
  - value_template: '{{ states(''sensor.ww_mitte_rl_ist_ww_oben_temperatur_3'') |
      float(0) >= states(''input_number.boiler_maximaltemperatur'') | float(63) }}'
    for:
      seconds: 30
    trigger: template
  conditions:
  - condition: state
    entity_id: switch.haus_verbauch
    state: 'on'
  actions:
  - target:
      entity_id: switch.haus_verbauch
    action: switch.turn_off
  mode: single
- id: boiler_netzbezug_schutz_ausschalten
  alias: Boiler Netzbezug Schutz
  description: Schaltet den Boiler aus, wenn beim Laden deutlicher Netzbezug entsteht.
  triggers:
  - value_template: '{{ states(''sensor.leistung_saldierung'') | float(0) > states(''input_number.boiler_max_netzbezug'')
      | float(300) }}'
    for:
      minutes: 2
    trigger: template
  conditions:
  - condition: state
    entity_id: switch.haus_verbauch
    state: 'on'
  actions:
  - target:
      entity_id: switch.haus_verbauch
    action: switch.turn_off
  mode: single
- id: boiler_benachrichtigung_gestartet
  alias: Boiler Benachrichtigung gestartet
  description: Meldet Start bei genuegend PV-Ueberschuss.
  triggers:
  - from: 'off'
    to: 'on'
    entity_id: switch.haus_verbauch
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.leistung_saldierung'') | float(0) < ((states(''input_number.boiler_leistung'')
      | float(2300) + states(''input_number.boiler_reserveleistung'') | float(70))
      * -1) }}'
  actions:
  - action: script.push_matrix
    data:
      titel: ☀️ Boiler gestartet
      text: 'Boiler gestartet: genuegend PV-Ueberschuss. Saldierung: {{ states(''sensor.leistung_saldierung'')
        | float(0) | round(0) }} W, WW-Oben: {{ states(''sensor.ww_mitte_rl_ist_ww_oben_temperatur_3'')
        }} C.'
      meldung: boiler_start
  mode: single
- id: boiler_tagesbericht
  alias: Tagesabschluss
  description: Taegl. Push mit Energie-Kennzahlen - Zeit via input_datetime steuerbar
  triggers:
  - trigger: time
    at: input_datetime.tagesabschluss_push_zeit
  conditions: []
  actions:
  - action: script.push_matrix
    data:
      titel: "\U0001F4CA Tagesabschluss Energie"
      text: 'Tagesabschluss {{ now().strftime(''%d.%m.%Y'') }}


        PV Produktion:   {{ states(''sensor.energy_manager_pv_produktion_heute_kwh'')
        | float(0) | round(1) }} kWh

        Einspeisung:     {{ states(''sensor.energy_manager_einspeisung_heute_kwh_2'')
        | float(0) | round(1) }} kWh

        Netzbezug:       {{ states(''sensor.energy_manager_netzbezug_heute_kwh'')
        | float(0) | round(1) }} kWh

        Haus & WP:       {{ states(''sensor.energy_manager_hausverbrauch_heute_kwh'')
        | float(0) | round(1) }} kWh


        Autarkie:        {{ states(''sensor.energy_manager_autarkiegrad_heute'') |
        float(0) | round(1) }} %

        Eigenverbrauch:  {{ states(''sensor.energy_manager_eigenverbrauchsquote_heute'')
        | float(0) | round(1) }} %


        Boiler (WW-Oben):{{ states(''sensor.ww_mitte_rl_ist_ww_oben_temperatur_3'')
        | float(0) | round(1) }} C

        Solcast morgen:  {{ states(''sensor.solcast_pv_forecast_prognose_morgen'')
        | float(0) | round(1) }} kWh


        Waermepumpe heute:

        WP-Strom:        {{ states(''sensor.energy_manager_wp_heute_kwh'') | float(0)
        | round(1) }} kWh

        Takte (Starts):  {{ states(''sensor.wp_starts_heute'') | int(0) }}{% set st
        = states(''sensor.wp_starts_heute'') | float(0) %}{% if st > 0 %} | Oe {{
        (states(''sensor.wp_laufzeit_heute'') | float(0) * 60 / st) | round(0) | int
        }} min/Lauf{% endif %}

        Laufzeit:        {{ states(''sensor.wp_laufzeit_heute'') | float(0) | round(1)
        }} h

        Kurztakte:       {{ states(''sensor.wp_kurztakte_heute'') | int(0) }}{% set
        w = [''binary_sensor.warnung_hmip_batterie_schwach'', ''binary_sensor.warnung_sd_karte_voll'',
        ''binary_sensor.warnung_wp_taktet'', ''binary_sensor.alarm_wp_heizt_nicht'',
        ''binary_sensor.alarm_wohnraum_zu_kalt'', ''binary_sensor.alarm_warmwasser_zu_kalt'',
        ''binary_sensor.alarm_fuhler_ausgefallen'', ''binary_sensor.alarm_heizstab_ohne_pv'']
        | select(''is_state'', ''on'') | list %}{% if w | count > 0 %}


        Aktiv: {% for x in w %}{{ state_attr(x, ''friendly_name'') }}{{ '', '' if
        not loop.last }}{% endfor %}{% endif %}'
      meldung: tagesabschluss
  mode: single
- id: boiler_monatsbericht
  alias: Boiler Monatsbericht
  description: Meldet am Monatsende die per PV-Ueberschuss geladene Energie.
  triggers:
  - trigger: time
    at: '23:56:00'
  conditions:
  - condition: template
    value_template: '{{ (now() + timedelta(days=1)).month != now().month }}'
  actions:
  - action: script.push_matrix
    data:
      titel: "\U0001F4C5 Boiler Monatsbericht"
      text: 'Monat {{ now().strftime(''%m.%Y'') }}: {{ states(''input_number.boiler_kapazitaet_monat'')
        | float(0) | round(2) }} kWh mit PV-Ueberschuss geladen. Ladezeit: {{ states(''input_number.boiler_ladezeit_monat'')
        | float(0) | round(2) }} h.'
      meldung: boiler_monat
  mode: single
- id: boiler_monatswerte_reset
  alias: Boiler Monatswerte reset
  description: Setzt die Monatswerte am Monatsanfang zurueck.
  triggers:
  - trigger: time
    at: 00:05:00
  conditions:
  - condition: template
    value_template: '{{ now().day == 1 }}'
  actions:
  - data:
      value: 0
    target:
      entity_id: input_number.boiler_kapazitaet_monat
    action: input_number.set_value
  - data:
      value: 0
    target:
      entity_id: input_number.boiler_ladezeit_monat
    action: input_number.set_value
  mode: single
- id: '1794905257688'
  alias: Batterie Simulation 10 kWh
  description: 'Virtuelle 10-kWh-Batterie (9 kWh nutzbar, 90 % Wirkungsgrad, max.
    2,5 kW). Rechnet jede Zählerbewegung von Netzbezug und Rückspeisung um: Überschuss
    lädt die Batterie, Bezug entlädt sie. Ergebnis in input_number.batterie_sim_*.'
  triggers:
  - entity_id: sensor.energie_saldierung
    id: bezug
    note: Netzbezug, Einheit MWh
    trigger: state
  - entity_id: sensor.netz_ruckspeisung_kwh
    id: einspeisung
    note: Rückspeisung, Einheit kWh
    trigger: state
  conditions:
  - '{{ 0 < delta | float(0) < 5 }}'
  actions:
  - variables:
      eta: 0.9
      kap: 9
      leistung: '{{ states(''sensor.leistung_saldierung'') | float(0) | abs }}'
      soc: '{{ states(''input_number.batterie_sim_ladestand'') | float(0) }}'
  - note: Leistungsbegrenzung 2,5 kW
    variables:
      menge: '{{ (delta * ([1, 2500 / leistung] | min)) if leistung > 0 else delta
        }}'
  - choose:
    - conditions:
      - condition: trigger
        id: bezug
      sequence:
      - variables:
          entladen: '{{ [menge, soc] | min }}'
      - action: input_number.set_value
        data:
          value: '{{ [soc - entladen, 0] | max | round(4) }}'
        target:
          entity_id: input_number.batterie_sim_ladestand
      - action: input_number.set_value
        data:
          value: '{{ (states(''input_number.batterie_sim_netzbezug_zaehler'') | float(0)
            + delta - entladen) | round(4) }}'
        target:
          entity_id: input_number.batterie_sim_netzbezug_zaehler
    - conditions:
      - condition: trigger
        id: einspeisung
      sequence:
      - variables:
          laden: '{{ [menge, (kap - soc) / eta] | min }}'
      - action: input_number.set_value
        data:
          value: '{{ [soc + laden * eta, kap] | min | round(4) }}'
        target:
          entity_id: input_number.batterie_sim_ladestand
      - action: input_number.set_value
        data:
          value: '{{ (states(''input_number.batterie_sim_einspeisung_zaehler'') |
            float(0) + delta - laden) | round(4) }}'
        target:
          entity_id: input_number.batterie_sim_einspeisung_zaehler
  max: 50
  max_exceeded: silent
  mode: queued
  variables:
    delta: '{% set a = trigger.from_state.state | float(none) %}{% set b = trigger.to_state.state
      | float(none) %}{% if a is none or b is none %}0{% else %}{{ ((b - a) * (1000
      if trigger.id == ''bezug'' else 1)) | round(5) }}{% endif %}'
- id: '1794906157684'
  alias: 'Batterie Simulation: autarken Tag zählen'
  description: Zählt kurz vor Mitternacht einen autarken Tag, wenn der simulierte
    Netzbezug des Tages unter 0,5 kWh liegt.
  triggers:
  - at: '23:59:30'
    trigger: time
  conditions:
  - below: 0.5
    condition: numeric_state
    entity_id: sensor.batterie_sim_netzbezug_heute
  actions:
  - action: counter.increment
    target:
      entity_id: counter.batterie_sim_autarke_tage
  mode: single
- id: '1794924627199'
  alias: FBH Smart – Wetterprognose aktualisieren
  description: Holt alle 30 min die met.no-Stundenprognose und schreibt Aussen-Mittel
    6 h, Min 12 h und Max morgen in Helfer (für FBH Smart-Steuerung).
  triggers:
  - minutes: /30
    trigger: time_pattern
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
  - action: weather.get_forecasts
    data:
      type: hourly
    response_variable: fc
    target:
      entity_id: weather.zuhause
  - variables:
      fl: '{{ fc[''weather.zuhause''].forecast }}'
      morgen: '{{ (now() + timedelta(days=1)).date() | string }}'
      tmax_morgen: '{% set ns = namespace(v=[]) %}{% for f in fl %}{% if (as_local(as_datetime(f.datetime)).date()
        | string) == morgen %}{% set ns.v = ns.v + [f.temperature] %}{% endif %}{%
        endfor %}{{ (ns.v | max) if ns.v | count > 0 else none }}'
  - action: input_number.set_value
    data:
      value: '{{ (fl[:6] | map(attribute=''temperature'') | list | average) | round(1)
        }}'
    target:
      entity_id: input_number.aussen_prognose_mittel_6h
  - action: input_number.set_value
    data:
      value: '{{ fl[:12] | map(attribute=''temperature'') | min }}'
    target:
      entity_id: input_number.aussen_prognose_min_12h
  - if:
    - condition: template
      value_template: '{{ tmax_morgen is number }}'
    then:
    - action: input_number.set_value
      data:
        value: '{{ tmax_morgen }}'
      target:
        entity_id: input_number.aussen_prognose_max_morgen
  mode: single
- id: '1794924729759'
  alias: FBH Smart – Steuerung
  description: Schaltet die FBH-Pumpe nach sensor.fbh_smart_entscheid. Nur aktiv,
    wenn input_boolean.fbh_smart_aktiv EIN ist und keine Hand-Pause läuft (Beobachtungsmodus
    = Schalter AUS). AUS nur bei Entscheid «AUS – …»; bei unavailable/unknown wird
    nicht geschaltet (Pumpe bleibt, wie sie ist; Watchdog schaltet nach 30 min EIN).
    Ergänzt 24.11.2026.
  triggers:
  - entity_id: sensor.fbh_smart_entscheid
    trigger: state
  - minutes: /5
    trigger: time_pattern
  - entity_id: input_boolean.fbh_smart_aktiv
    to: 'on'
    trigger: state
  - entity_id: timer.fbh_hand_pause
    to: idle
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.fbh_smart_aktiv
    state: 'on'
  - condition: state
    entity_id: timer.fbh_hand_pause
    state: idle
  - condition: state
    entity_id: switch.homematic_ip_fbh_pumpe_hk_ii
    state:
    - 'on'
    - 'off'
  actions:
  - variables:
      ist_ein: '{{ is_state(''switch.homematic_ip_fbh_pumpe_hk_ii'', ''on'') }}'
      soll_ein: '{{ states(''sensor.fbh_smart_entscheid'').startswith(''EIN'') }}'
      soll_aus: '{{ states(''sensor.fbh_smart_entscheid'').startswith(''AUS'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ soll_ein and not ist_ein }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.homematic_ip_fbh_pumpe_hk_ii
      - action: logbook.log
        data:
          entity_id: switch.homematic_ip_fbh_pumpe_hk_ii
          message: 'EIN: {{ states(''sensor.fbh_smart_entscheid'') }}'
          name: FBH Smart
    - conditions:
      - condition: template
        value_template: '{{ soll_aus and ist_ein }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.homematic_ip_fbh_pumpe_hk_ii
      - action: logbook.log
        data:
          entity_id: switch.homematic_ip_fbh_pumpe_hk_ii
          message: 'AUS: {{ states(''sensor.fbh_smart_entscheid'') }}'
          name: FBH Smart
  mode: single
- id: '1794924734262'
  alias: FBH Smart – Hand erkannt
  description: Wird die FBH-Pumpe ausserhalb von HA (HmIP-App, Taster, HmIP-Notregel)
    entgegen dem Smart-Entscheid geschaltet, pausiert die Smart-Steuerung 3 h.
  triggers:
  - entity_id: switch.homematic_ip_fbh_pumpe_hk_ii
    from:
    - 'on'
    - 'off'
    to:
    - 'on'
    - 'off'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.fbh_smart_aktiv
    state: 'on'
  - condition: template
    value_template: '{{ trigger.to_state.context.parent_id is none and trigger.to_state.context.user_id
      is none and (trigger.to_state.state == ''on'') != states(''sensor.fbh_smart_entscheid'').startswith(''EIN'')
      }}'
  actions:
  - action: timer.start
    target:
      entity_id: timer.fbh_hand_pause
  - action: logbook.log
    data:
      entity_id: switch.homematic_ip_fbh_pumpe_hk_ii
      message: Hand-Eingriff erkannt ({{ trigger.to_state.state }}), Automatik pausiert
        3 h
      name: FBH Smart
  mode: single
- id: '1794924738474'
  alias: FBH Smart – Watchdog
  description: 'Innenfühler oder Prognose länger als 30 min nicht verfügbar: Meldung;
    bei aktiver Smart-Steuerung FBH sicherheitshalber EIN.'
  triggers:
  - entity_id:
    - sensor.homematic_ip_innen_temperatur_luftfeuchtigkeitssensor_temperatur
    - sensor.wohnraum_prognose
    for:
      minutes: 30
    to:
    - unavailable
    - unknown
    trigger: state
  conditions: []
  actions:
  - action: persistent_notification.create
    data:
      message: '{{ trigger.to_state.name }} seit 30 min nicht verfügbar. Smart-Steuerung
        kann nicht sicher entscheiden.'
      notification_id: fbh_smart_watchdog
      title: FBH Smart – Watchdog
  - if:
    - condition: state
      entity_id: input_boolean.fbh_smart_aktiv
      state: 'on'
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.homematic_ip_fbh_pumpe_hk_ii
  mode: single
- id: '1795003456305'
  alias: FBH Smart – Lüften erkannt
  description: Stempelt den Zeitpunkt, an dem eine der Lüftungs-Türen/Fenster (Hibiscus,
    Kräuter, Küche) nach dem Öffnen wieder geschlossen wurde. Die FBH-Smart-Steuerung
    hält danach den Nachlauf (input_number.fbh_lueften_nachlauf) lang ihren Zustand.
  triggers:
  - entity_id:
    - binary_sensor.homematic_ip_turkontakt_hibiscus_tur
    - binary_sensor.homematic_ip_turkontakt_krauter_tur
    - binary_sensor.homematic_ip_fensterkontakt_kuche_tur
    to: 'off'
    trigger: state
    from: 'on'
  conditions: []
  actions:
  - action: input_datetime.set_datetime
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    target:
      entity_id: input_datetime.fbh_lueften_zuletzt_geschlossen
  mode: queued
- id: '1795023607622'
  alias: WP Kennzahlen – Takte zählen
  description: Zählt Verdichterstarts und Kurztakte anhand des gefilterten Sensors
    binary_sensor.wp_verdichter_lauf_gefiltert (Ein erst nach 2 min Lauf, Aus erst
    nach 8 min Stillstand). Kurze Leistungseinbrüche (vermutlich Abtauung) und Pulse
    < 2 min zählen damit nicht als Start/Kurztakt – sie zählt «WP Kennzahlen – Abtau-Unterbrüche
    zählen». Kurztakt-Dauer = gefilterte Dauer − 6 min (Verzögerung 8 min Aus − 2
    min Ein). Umgestellt am 22.11.2026; vorher Rohsensor binary_sensor.wp_verdichter_lauft.
    Quelle für die Kennzahlen im Solar Manager, Register WP.
  triggers:
  - entity_id: binary_sensor.wp_verdichter_lauf_gefiltert
    from: 'off'
    id: start
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.wp_verdichter_lauf_gefiltert
    from: 'on'
    id: stopp
    to: 'off'
    trigger: state
  conditions: []
  actions:
  - variables:
      dauer_min: '{{ ((now() - trigger.from_state.last_changed).total_seconds() /
        60 - 6) | round(1) }}'
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.wp_verdichter_starts
    - conditions:
      - condition: trigger
        id: stopp
      - condition: template
        value_template: '{{ dauer_min | float(99) < states(''input_number.wp_kurztakt_grenze'')
          | float(20) }}'
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.wp_kurztakte
      - action: logbook.log
        data:
          entity_id: binary_sensor.wp_verdichter_lauf_gefiltert
          message: 'Kurztakt: {{ dauer_min }} min'
          name: WP Kennzahlen
  mode: queued
- id: '1795023621272'
  alias: Gebäude – Auskühlrate messen
  description: 'Misst, wie schnell der Wohnraum auskühlt, solange die FBH-Pumpe steht
    (inkl. Nachwärme des Estrichs). Pumpe AUS: Startwerte merken. Pumpe EIN: Auskühlrate
    K/h und Zeitkonstante τ = (Ti−Ta)/Rate berechnen. Gewertet nur bei Pause 2–24
    h und PV-Ertrag < 0.3 kWh (keine Sonnengewinne).'
  triggers:
  - entity_id: switch.homematic_ip_fbh_pumpe_hk_ii
    from: 'on'
    id: aus
    to: 'off'
    trigger: state
  - entity_id: switch.homematic_ip_fbh_pumpe_hk_ii
    from: 'off'
    id: ein
    to: 'on'
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ has_value(''sensor.homematic_ip_innen_temperatur_luftfeuchtigkeitssensor_temperatur'')
      and has_value(''sensor.homematic_ip_aussen_temperatur_luftfeuchtigkeitssensor_temperatur'')
      }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: aus
      sequence:
      - action: input_datetime.set_datetime
        data:
          timestamp: '{{ now().timestamp() }}'
        target:
          entity_id: input_datetime.auskuhlung_start
      - action: input_number.set_value
        data:
          value: '{{ states(''sensor.homematic_ip_innen_temperatur_luftfeuchtigkeitssensor_temperatur'')
            | float }}'
        target:
          entity_id: input_number.auskuhlung_start_innen
      - action: input_number.set_value
        data:
          value: '{{ states(''sensor.homematic_ip_aussen_temperatur_luftfeuchtigkeitssensor_temperatur'')
            | float }}'
        target:
          entity_id: input_number.auskuhlung_start_aussen
      - action: input_number.set_value
        data:
          value: '{{ states(''sensor.energy_manager_pv_produktion_monat_kwh'') | float(0)
            }}'
        target:
          entity_id: input_number.auskuhlung_start_pv
    - conditions:
      - condition: trigger
        id: ein
      sequence:
      - variables:
          t0: '{{ state_attr(''input_datetime.auskuhlung_start'', ''timestamp'') |
            float(0) }}'
          ti0: '{{ states(''input_number.auskuhlung_start_innen'') | float(0) }}'
          ti1: '{{ states(''sensor.homematic_ip_innen_temperatur_luftfeuchtigkeitssensor_temperatur'')
            | float(0) }}'
          ta_m: '{{ ((states(''input_number.auskuhlung_start_aussen'') | float(0)
            + states(''sensor.homematic_ip_aussen_temperatur_luftfeuchtigkeitssensor_temperatur'')
            | float(0)) / 2) | round(2) }}'
          pv: '{{ (states(''sensor.energy_manager_pv_produktion_monat_kwh'') | float(0)
            - states(''input_number.auskuhlung_start_pv'') | float(0)) | round(2)
            }}'
      - variables:
          h: '{{ ((now().timestamp() - t0) / 3600) | round(3) }}'
      - variables:
          rate: '{{ ((ti0 - ti1) / h) | round(3) if h > 0 else 0 }}'
      - variables:
          tau: '{{ (((ti0 + ti1) / 2 - ta_m) / rate) | round(1) if rate > 0.005 else
            0 }}'
      - else:
        - action: logbook.log
          data:
            entity_id: switch.homematic_ip_fbh_pumpe_hk_ii
            message: 'nicht gewertet: Pause {{ h | round(1) }} h, PV {{ pv }} kWh,
              Rate {{ rate }} K/h'
            name: Gebäude Auskühlung
        if:
        - condition: template
          value_template: '{{ t0 > 0 and 2 <= h <= 24 and 0 <= pv < 0.3 and rate >
            0.005 }}'
        then:
        - action: input_number.set_value
          data:
            value: '{{ rate }}'
          target:
            entity_id: input_number.gebaude_auskuhlrate_letzte
        - action: input_number.set_value
          data:
            value: '{{ [tau, 5000] | min }}'
          target:
            entity_id: input_number.gebaude_zeitkonstante_letzte
        - action: input_text.set_value
          data:
            value: '{{ as_timestamp(t0 | int) | timestamp_custom(''%d.%m. %H:%M'')
              }}–{{ now().strftime(''%H:%M'') }} · {{ h | round(1) }} h · {{ ti0 }}→{{
              ti1 }} °C · aussen Ø {{ ta_m }} °C · {{ rate }} K/h · τ {{ tau }} h'
          target:
            entity_id: input_text.auskuhlung_letzte_messung
  mode: queued
- id: '1795023623829'
  alias: Gebäude Tageswerte aktualisieren
  description: 'Aktualisiert den SQL-Sensor sensor.gebaude_tageswerte (Polling ist
    abgeschaltet, um den Raspberry zu schonen): nach Mitternacht, stündlich und beim
    Start.'
  triggers:
  - event: start
    trigger: homeassistant
  - minutes: 7
    trigger: time_pattern
  conditions: []
  actions:
  - delay:
      seconds: 30
  - action: homeassistant.update_entity
    target:
      entity_id: sensor.gebaude_tageswerte
  mode: single
- id: '1795028456596'
  alias: Alarm – kritisch aufs Handy
  description: 'Sendet eine Push-Meldung (zeitkritisch), sobald ein kritischer Alarm
    aktiv wird, und eine Entwarnung, wenn er wieder weg ist. Alarme: binary_sensor.alarm_*
    (Dashboard «Alarme & Warnungen»).'
  triggers:
  - entity_id:
    - binary_sensor.alarm_wp_heizt_nicht
    - binary_sensor.alarm_wohnraum_zu_kalt
    - binary_sensor.alarm_warmwasser_zu_kalt
    - binary_sensor.alarm_fuhler_ausgefallen
    - binary_sensor.alarm_heizstab_ohne_pv
    from: 'off'
    id: ein
    to: 'on'
    trigger: state
  - entity_id:
    - binary_sensor.alarm_wp_heizt_nicht
    - binary_sensor.alarm_wohnraum_zu_kalt
    - binary_sensor.alarm_warmwasser_zu_kalt
    - binary_sensor.alarm_fuhler_ausgefallen
    - binary_sensor.alarm_heizstab_ohne_pv
    from: 'on'
    id: aus
    to: 'off'
    trigger: state
  conditions: []
  actions:
  - variables:
      details: '{% set e = trigger.entity_id %}{% if e == ''binary_sensor.alarm_wp_heizt_nicht''
        %}FBH-Pumpe läuft seit ≥ 90 min, Verdichter steht, Speicher unter VL {{ states(''sensor.ww_mitte_rl_ist_ww_oben_temperatur'')
        }} °C. WP-Display auf Störung prüfen.{% elif e == ''binary_sensor.alarm_wohnraum_zu_kalt''
        %}Wohnraum {{ states(''sensor.homematic_ip_innen_temperatur_luftfeuchtigkeitssensor_temperatur'')
        }} °C (< 21.8 °C seit 15 min). FBH-Pumpe: {{ states(''switch.homematic_ip_fbh_pumpe_hk_ii'')
        }}.{% elif e == ''binary_sensor.alarm_warmwasser_zu_kalt'' %}Speicher oben
        {{ states(''sensor.ww_mitte_rl_ist_ww_oben_temperatur_3'') }} °C (< 40 °C
        seit 30 min).{% elif e == ''binary_sensor.alarm_fuhler_ausgefallen'' %}{%
        set f = [''sensor.ww_mitte_rl_ist_ww_oben_temperatur_3'', ''sensor.ww_mitte_rl_ist_ww_oben_temperatur'',
        ''sensor.ww_mitte_rl_ist_ww_oben_temperatur_2'', ''sensor.16_waku_rl_hk_ii_vl_hk_ii_temperatur_3'',
        ''sensor.16_waku_rl_hk_ii_vl_hk_ii_temperatur_2'', ''sensor.homematic_ip_innen_temperatur_luftfeuchtigkeitssensor_temperatur'',
        ''sensor.homematic_ip_aussen_temperatur_luftfeuchtigkeitssensor_temperatur'',
        ''sensor.heizung_verbrauch_w''] %}Betroffen: {% for x in f if states[x] is
        none or not has_value(x) or (now() - states[x].last_reported).total_seconds()
        > 1800 %}{{ state_attr(x, ''friendly_name'') or x }}{{ '', '' if not loop.last
        }}{% endfor %}. FBH-Smart-Steuerung prüfen.{% elif e == ''binary_sensor.alarm_heizstab_ohne_pv''
        %}Heizstab EIN bei {{ states(''sensor.energy_manager_netz_aktuell_w'') | int(0)
        }} W Netzbezug seit 10 min.{% else %}{{ e }}{% endif %}'
  - choose:
    - conditions:
      - condition: trigger
        id: ein
      sequence:
      - action: script.push_matrix
        data:
          titel: "\U0001F6A8 {{ trigger.to_state.name }}"
          text: '{{ details }}'
          daten:
            push:
              interruption-level: time-sensitive
            tag: '{{ trigger.entity_id }}'
            url: /alarme-a/alarme
          meldung: alarm_kritisch
    - conditions:
      - condition: trigger
        id: aus
      sequence:
      - action: script.push_matrix
        data:
          titel: '✅ Entwarnung: {{ trigger.to_state.name }}'
          text: Alarm seit {{ ((now() - trigger.from_state.last_changed).total_seconds()
            / 60) | round(0) | int }} min aktiv, jetzt wieder normal.
          daten:
            tag: '{{ trigger.entity_id }}'
          meldung: alarm_kritisch
  mode: queued
- id: '1795165701717'
  alias: Tore & Haustür – Push bei Öffnen/Schliessen
  description: Sendet eine Push-Meldung mit Text an die Handys gemäss Push-Zuweisung
    (Alarme & Warnungen → Verwaltung), wenn Garagentor Auto, Garagentor Werkraum oder
    die Eingangstüre geöffnet oder geschlossen wird.
  triggers:
  - id: offen
    target:
      entity_id:
      - binary_sensor.homematic_ip_garagentor_auto_tur
      - binary_sensor.homematic_ip_garagentor_werkraum_tur
    trigger: garage_door.opened
  - id: offen
    target:
      entity_id: binary_sensor.homematic_ip_eingangsture_tur
    trigger: door.opened
  - id: zu
    target:
      entity_id:
      - binary_sensor.homematic_ip_garagentor_auto_tur
      - binary_sensor.homematic_ip_garagentor_werkraum_tur
    trigger: garage_door.closed
  - id: zu
    target:
      entity_id: binary_sensor.homematic_ip_eingangsture_tur
    trigger: door.closed
  conditions: []
  actions:
  - variables:
      aktion: '{{ ''geöffnet'' if trigger.id == ''offen'' else ''geschlossen'' }}'
      icon: "{{ '\U0001F697' if 'garagentor' in (trigger.entity_id | string) else
        '\U0001F6AA' }}"
      name: '{% set n = {''binary_sensor.homematic_ip_garagentor_auto_tur'': ''Garagentor
        Auto'', ''binary_sensor.homematic_ip_garagentor_werkraum_tur'': ''Garagentor
        Werkraum'', ''binary_sensor.homematic_ip_eingangsture_tur'': ''Haustür''}
        %}{{ n.get(trigger.entity_id, ''Tür'') }}'
      zeit: '{{ now().strftime(''%H:%M'') }}'
  - action: script.push_matrix
    data:
      titel: '{{ icon }} {{ name }} {{ aktion }}'
      text: '{{ name }} wurde um {{ zeit }} Uhr {{ aktion }}.'
      meldung: tore_auf_zu
  mode: parallel
- id: '1795166098939'
  alias: Tor offen – Erinnerung
  description: Erinnert, wenn ein Garagentor oder die Haustür 15 min offen bleibt.
    (Die 22:00-Meldung übernimmt neu «Alarm Tore/Haustür – Freigabe & Bedienung»,
    inkl. Fenster.)
  triggers:
  - id: lange
    options:
      for: 00:15:00
    target:
      entity_id:
      - binary_sensor.homematic_ip_garagentor_auto_tur
      - binary_sensor.homematic_ip_garagentor_werkraum_tur
    trigger: garage_door.opened
  - id: lange
    options:
      for: 00:15:00
    target:
      entity_id: binary_sensor.homematic_ip_eingangsture_tur
    trigger: door.opened
  conditions: []
  actions:
  - variables:
      namen:
        binary_sensor.homematic_ip_eingangsture_tur: Haustür
        binary_sensor.homematic_ip_garagentor_auto_tur: Garagentor Auto
        binary_sensor.homematic_ip_garagentor_werkraum_tur: Garagentor Werkraum
  - choose:
    - conditions:
      - condition: trigger
        id: lange
      sequence:
      - variables:
          name: '{{ namen.get(trigger.entity_id, ''Tor'') }}'
      - action: script.push_matrix
        data:
          text: '{{ name }} ist seit 15 Minuten offen.'
          titel: "{{ '\U0001F697' if 'garagentor' in trigger.entity_id else '\U0001F6AA'
            }} {{ name }} noch offen"
          meldung: tor_offen
  mode: parallel
- id: '1795166113146'
  alias: Bewegung nachts – Garage/Haustür
  description: Meldet Bewegung bei der Garage oder Haustür zwischen 22:00 und 06:00.
    Danach 10 min Pause, damit nicht jede Bewegung eine Meldung auslöst.
  triggers:
  - target:
      entity_id:
      - binary_sensor.homematic_ip_bewegungsmelder_garage_bewegung
      - binary_sensor.homematic_ip_bewegungsmelder_hausture_bewegung
    trigger: motion.detected
  conditions:
  - after: '22:00:00'
    before: 06:00:00
    condition: time
  actions:
  - variables:
      ort: '{{ ''Garage'' if ''garage'' in trigger.entity_id else ''Haustür'' }}'
  - action: script.push_matrix
    data:
      text: Bewegung bei {{ ort }} um {{ now().strftime('%H:%M') }} Uhr erkannt.
      titel: "\U0001F463 Bewegung {{ ort }}"
      meldung: bewegung_nachts
  - delay: 00:10:00
  max_exceeded: silent
  mode: single
- id: '1795166119319'
  alias: Türe offen bei Kälte
  description: Meldet, wenn eine Aussen- oder Zimmertüre 20 min offen ist und es aussen
    kälter als 12 °C ist (Wärmeverlust, WP läuft unnötig).
  triggers:
  - options:
      for: 00:20:00
    target:
      entity_id:
      - binary_sensor.homematic_ip_turkontakt_spielzimmer_terrasse_tur
      - binary_sensor.homematic_ip_turkontakt_cheminee_tur
      - binary_sensor.homematic_ip_turkontakt_hibiscus_tur
      - binary_sensor.homematic_ip_turkontakt_krauter_tur
      - binary_sensor.homematic_ip_fensterkontakt_kuche_tur
      - binary_sensor.homematic_ip_fensterkontakt_kellertreppe_tur
      - binary_sensor.homematic_ip_fensterkontakt_gaste_wc_tur
    trigger: door.opened
  conditions:
  - below: 12
    condition: numeric_state
    entity_id: sensor.homematic_ip_aussen_temperatur_luftfeuchtigkeitssensor_temperatur
  actions:
  - variables:
      name: '{{ (state_attr(trigger.entity_id, ''friendly_name'') or trigger.entity_id)
        | replace(''Homematic IP '','''') | replace(''Türkontakt '','''') | replace(''Fensterkontakt
        '','''') | replace('' Tür'','''') }}'
  - action: script.push_matrix
    data:
      text: '{{ name }} ist seit 20 Minuten offen, aussen {{ states(''sensor.homematic_ip_aussen_temperatur_luftfeuchtigkeitssensor_temperatur'')
        }} °C.'
      titel: "\U0001F976 {{ name }} offen"
      meldung: tuere_kaelte
  mode: parallel
- id: '1795166949079'
  alias: Boiler gestoppt – Meldung
  description: 'Nur Beobachtung: meldet, wenn der Boiler-Heizstab (switch.haus_verbauch)
    ausgeht, mit Grund. Schaltet selbst nichts. Die Abschaltung machen die Steuer-Automationen
    (PV, Max.-Temperatur, Netzbezug) unabhängig davon.'
  triggers:
  - entity_id: switch.haus_verbauch
    from: 'on'
    to: 'off'
    trigger: state
  conditions: []
  actions:
  - variables:
      grund: '{% set ns = namespace(g=''manuell oder andere Ursache'') %}{% for e,
        g in [(''automation.boiler_maximaltemperatur_erreicht'', ''Maximaltemperatur
        erreicht''), (''automation.boiler_netzbezug_schutz'', ''Netzbezug-Schutz''),
        (''automation.pv_boiler_ausschalten'', ''zu wenig PV-Überschuss'')] %}{% set
        lt = state_attr(e, ''last_triggered'') %}{% if lt and (now() - lt).total_seconds()
        < 60 %}{% set ns.g = g %}{% endif %}{% endfor %}{{ ns.g }}'
      saldo: '{{ states(''sensor.leistung_saldierung'') | float(0) | round(0) | int
        }}'
      ww: '{{ states(''sensor.ww_mitte_rl_ist_ww_oben_temperatur_3'') }}'
  - action: script.push_matrix
    data:
      text: 'Grund: {{ grund }}. Saldierung: {{ saldo }} W, WW-Oben: {{ ww }} °C.'
      titel: "\U0001F6E2️ Boiler gestoppt"
      meldung: boiler_stopp
  mode: queued
- id: '1795185734859'
  alias: Alarm Tore/Haustür – Freigabe & Bedienung
  description: Gibt die nächtliche Tor-/Haustür-Überwachung 5 min frei, wenn ein Garagentor
    per Öffner (HmIP-App/HA) geöffnet, die Push-Taste «Ich bin's» oder der HA-Knopf
    gedrückt wird. Solange ein Tor/die Haustür offen ist, bleibt die Freigabe aktiv;
    1 min nach dem Schliessen aller drei ist die Überwachung wieder aktiv. Meldet
    um 22:00 den Status (immer) und um 23:55 offene Tore/Fenster (nur wenn etwas offen
    ist) und verarbeitet die Push-Taste «Jetzt scharf schalten».
  triggers:
  - entity_id:
    - switch.homematic_ip_offner_garagentor_auto
    - switch.homematic_ip_offner_garagentor_werkraum
    id: oeffner
    note: Impuls des HmIP-Öffners kommt ca. 1 s vor dem Torkontakt
    to: 'on'
    trigger: state
  - event_data:
      action: ALARM_TORE_FREIGABE
    event_type: mobile_app_notification_action
    id: push_freigabe
    trigger: event
  - entity_id: input_button.alarm_tore_freigabe_geben
    id: knopf
    not_from:
    - unavailable
    trigger: state
  - entity_id: binary_sensor.tore_und_haustur
    for: 00:01:00
    id: alles_zu
    note: 1 min nach dem Schliessen wieder scharf
    to: 'off'
    trigger: state
  - id: abgelaufen
    target:
      entity_id: timer.alarm_tore_freigabe
    trigger: timer.finished
  - event_data:
      action: ALARM_SCHARF
    event_type: mobile_app_notification_action
    id: push_scharf
    trigger: event
  - trigger: time
    at: '22:00:00'
    id: info_2230
    note: Info, solange man noch wach ist
  - trigger: time
    at: '23:55:00'
    id: check_2355
    note: Letzte Kontrolle vor dem HmIP-Scharfschalten um 23:59:30
  conditions: []
  actions:
  - variables:
      alarm: alarm_control_panel.homematic_ip_hmip_alarm_control_panel
      offen_fenster: '{{ expand(''binary_sensor.alarmzone_fenster_und_turen'') | selectattr(''state'',
        ''eq'', ''on'') | map(attribute=''name'') | join('', '') }}'
      offen_tore: '{{ expand(''binary_sensor.tore_und_haustur'') | selectattr(''state'',
        ''eq'', ''on'') | map(attribute=''name'') | join('', '') }}'
      zeit: '{{ now().strftime(''%H:%M'') }}'
  - choose:
    - conditions:
      - condition: trigger
        id:
        - oeffner
        - push_freigabe
        - knopf
      sequence:
      - action: timer.start
        data:
          duration: 00:05:00
        target:
          entity_id: timer.alarm_tore_freigabe
      - if:
        - condition: state
          entity_id: alarm_control_panel.homematic_ip_hmip_alarm_control_panel
          state:
          - armed_home
          - armed_away
        then:
        - variables:
            quelle: '{% if trigger.id == ''oeffner'' %}Öffner {{ trigger.to_state.name
              | replace(''Homematic IP '', '''') }}{% elif trigger.id == ''push_freigabe''
              %}Push-Taste «Ich bin''s»{% else %}HA-Knopf{% endif %}'
        - action: script.push_matrix
          data:
            daten:
              tag: alarm_tore
            text: Freigabe um {{ zeit }} Uhr durch {{ quelle }}. Garagentore und Haustür
              lösen jetzt keinen Alarm aus; 1 min nach dem Schliessen wieder überwacht.
            titel: "\U0001F513 Freigabe Tore/Haustür"
            meldung: alarm_freigabe
    - conditions:
      - condition: trigger
        id: alles_zu
      - condition: state
        entity_id: timer.alarm_tore_freigabe
        state: active
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.alarm_tore_freigabe
      - if:
        - condition: state
          entity_id: alarm_control_panel.homematic_ip_hmip_alarm_control_panel
          state:
          - armed_home
          - armed_away
        then:
        - action: script.push_matrix
          data:
            daten:
              tag: alarm_tore
            text: Alles seit 1 min geschlossen ({{ zeit }} Uhr). Überwachung wieder
              aktiv.
            titel: "\U0001F512 Tore & Haustür wieder überwacht"
            meldung: alarm_freigabe
    - conditions:
      - condition: trigger
        id: abgelaufen
      sequence:
      - if:
        - condition: state
          entity_id: binary_sensor.tore_und_haustur
          state: 'on'
        then:
        - action: timer.start
          data:
            duration: 00:05:00
          note: Freigabe verlängern, solange noch etwas offen ist
          target:
            entity_id: timer.alarm_tore_freigabe
    - conditions:
      - condition: trigger
        id: push_scharf
      sequence:
      - else:
        - action: alarm_control_panel.alarm_arm_home
          target:
            entity_id: alarm_control_panel.homematic_ip_hmip_alarm_control_panel
        - action: script.push_matrix
          data:
            text: Hüllschutz um {{ zeit }} Uhr per Push-Taste scharf geschaltet.
            titel: "\U0001F512 Alarm scharf"
            meldung: alarm_freigabe
        if:
        - condition: state
          entity_id: binary_sensor.alarmzone_fenster_und_turen
          state: 'on'
        then:
        - action: script.push_matrix
          data:
            text: 'Noch offen: {{ offen_fenster }}. Bitte schliessen und erneut versuchen.'
            titel: ⚠️ Nicht scharf geschaltet
            meldung: alarm_freigabe
    - conditions:
      - condition: trigger
        id: info_2230
      sequence:
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: binary_sensor.tore_und_haustur
            state: 'on'
          - condition: state
            entity_id: binary_sensor.alarmzone_fenster_und_turen
            state: 'on'
        then:
        - action: script.push_matrix
          data:
            titel: "\U0001F319 Alarm-Info 22:00 – noch offen"
            text: 'Noch offen: {{ [offen_tore, offen_fenster] | reject(''eq'', '''')
              | join('', '') }}. Der Alarm (Hüllschutz) wird um 23:59 scharf.'
            meldung: alarm_freigabe
        else:
        - action: script.push_matrix
          data:
            titel: "\U0001F319 Alarm-Info 22:00"
            text: Alle Fenster, Türen, Garagentore und die Haustür sind zu. Der Alarm
              (Hüllschutz) wird um 23:59 scharf.
            meldung: alarm_freigabe
    - conditions:
      - condition: trigger
        id: check_2355
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.tore_und_haustur
          state: 'on'
        - condition: state
          entity_id: binary_sensor.alarmzone_fenster_und_turen
          state: 'on'
      sequence:
      - action: script.push_matrix
        data:
          titel: ⚠️ In 4 min scharf – noch offen
          text: 'Noch offen: {{ [offen_tore, offen_fenster] | reject(''eq'', '''')
            | join('', '') }}. Bitte schliessen.'
          daten:
            interruption-level: time-sensitive
          meldung: alarm_freigabe
  max: 10
  mode: queued
- id: '1795185753657'
  alias: Alarm Tore/Haustür – Überwachung bei scharfem HmIP-Alarm
  description: 'Bindet Garagentor Auto, Garagentor Werkraum und Haustür in den HmIP-Alarm
    ein (die drei Kontakte sind NICHT in der HmIP-Sicherheitszone). Ist der HmIP-Alarm
    scharf und öffnet sich eins davon länger als 2 s ohne Freigabe, kommt sofort eine
    Vorwarnung mit Taste «Ich bin''s»; ohne Freigabe/Ausschalten innert 2 min (Karenzzeit)
    folgt der Einbruchalarm als kritische Push-Meldung (3× im Minutentakt). Testmodus:
    gleicher Ablauf inkl. Taste, aber am Schluss nur Test-Meldung statt Alarm.'
  triggers:
  - note: 2 s Entprellung gegen Kontakt-Flattern
    options:
      for: 00:00:02
    target:
      entity_id: binary_sensor.homematic_ip_eingangsture_tur
    trigger: door.opened
  - options:
      for: 00:00:02
    target:
      entity_id:
      - binary_sensor.homematic_ip_garagentor_auto_tur
      - binary_sensor.homematic_ip_garagentor_werkraum_tur
    trigger: garage_door.opened
  conditions:
  - condition: state
    entity_id: alarm_control_panel.homematic_ip_hmip_alarm_control_panel
    state:
    - armed_home
    - armed_away
  actions:
  - variables:
      namen:
        binary_sensor.homematic_ip_eingangsture_tur: Haustür
        binary_sensor.homematic_ip_garagentor_auto_tur: Garagentor Auto
        binary_sensor.homematic_ip_garagentor_werkraum_tur: Garagentor Werkraum
  - variables:
      name: '{{ namen.get(trigger.entity_id, ''Tor/Tür'') }}'
      test: '{{ ''TEST – '' if is_state(''input_boolean.alarm_tore_testmodus'', ''on'')
        else '''' }}'
      zeit: '{{ now().strftime(''%H:%M'') }}'
  - if:
    - condition: state
      entity_id: timer.alarm_tore_freigabe
      state: active
    then:
    - if:
      - condition: state
        entity_id: input_boolean.alarm_tore_testmodus
        state: 'on'
      then:
      - action: script.push_matrix
        data:
          text: '{{ name }} um {{ zeit }} Uhr mit gültiger Freigabe geöffnet – kein
            Alarm.'
          titel: "\U0001F9EA Test OK: {{ name }}"
          meldung: alarm_einbruch
    - stop: Freigabe aktiv – berechtigte Öffnung
  - action: script.push_matrix
    data:
      daten:
        actions:
        - action: ALARM_TORE_FREIGABE
          authenticationRequired: true
          title: Ich bin's – Freigabe
        interruption-level: time-sensitive
        tag: alarm_tore
      text: Alarm ist scharf, {{ name }} wurde um {{ zeit }} Uhr ohne Freigabe geöffnet.
        Tippe «Ich bin's» oder schalte den Alarm in der HmIP-App aus, sonst wird in
        2 min Einbruchalarm ausgelöst.
      titel: '{{ test }}⚠️ {{ name }} geöffnet – Alarm in 2 min'
      meldung: alarm_einbruch
    note: Sofort nach dem Öffnen (2 s Entprellung)
  - continue_on_timeout: true
    note: Karenzzeit 2 min
    timeout: 00:02:00
    wait_for_trigger:
    - target:
        entity_id: timer.alarm_tore_freigabe
      trigger: timer.started
    - entity_id: alarm_control_panel.homematic_ip_hmip_alarm_control_panel
      to: disarmed
      trigger: state
  - if:
    - '{{ wait.trigger is not none }}'
    then:
    - action: script.push_matrix
      data:
        daten:
          tag: alarm_tore
        text: Kein Alarm ausgelöst.
        titel: '{{ test }}✅ {{ name }}: Freigabe erkannt'
        meldung: alarm_einbruch
    - stop: Freigabe oder Alarm ausgeschaltet innert Karenzzeit
  - if:
    - condition: state
      entity_id: input_boolean.alarm_tore_testmodus
      state: 'on'
    then:
    - action: script.push_matrix
      data:
        daten:
          tag: alarm_tore
        text: '{{ name }} um {{ zeit }} Uhr geöffnet, 2 min keine Freigabe. Im Scharfbetrieb
          käme jetzt der Einbruchalarm.'
        titel: "\U0001F9EA Test: hier wäre EINBRUCHALARM"
        meldung: alarm_einbruch
    - stop: Testmodus
  - action: persistent_notification.create
    data:
      message: '{{ name }} um {{ zeit }} Uhr ohne Freigabe geöffnet.'
      notification_id: alarm_tore
      title: "\U0001F6A8 Einbruchalarm {{ name }}"
  - note: Kritische Meldung 3× im Minutentakt, bis Freigabe oder HmIP-Alarm aus
    repeat:
      count: 3
      sequence:
      - action: script.push_matrix
        data:
          daten:
            push:
              sound:
                critical: 1
                name: default
                volume: 1
            tag: alarm_tore
          text: '{{ name }} wurde um {{ zeit }} Uhr bei scharfem Alarm geöffnet –
            keine Freigabe innert 2 min! ({{ repeat.index }}/3)'
          titel: "\U0001F6A8 EINBRUCHALARM – {{ name }}"
          meldung: alarm_einbruch
      - continue_on_timeout: true
        timeout: 00:01:00
        wait_for_trigger:
        - target:
            entity_id: timer.alarm_tore_freigabe
          trigger: timer.started
        - entity_id: alarm_control_panel.homematic_ip_hmip_alarm_control_panel
          to: disarmed
          trigger: state
      - if:
        - '{{ wait.trigger is not none }}'
        then:
        - action: script.push_matrix
          data:
            daten:
              tag: alarm_tore
            text: Einbruchalarm {{ name }} wurde quittiert.
            titel: ✅ Alarm quittiert
            meldung: alarm_einbruch
        - stop: Alarm quittiert
  max_exceeded: silent
  mode: single
- id: '1795185779832'
  alias: Alarm – nach nächtlichem Ausschalten wieder scharf
  description: 'Wird der HmIP-Alarm in der Nacht (23:59–04:55) von Hand ausgeschaltet
    (z. B. Heimkommen per HmIP-App), schaltet HA ihn wieder scharf (Hüllschutz), sobald
    ein Garagentor/die Haustür geöffnet und danach alles 1 min geschlossen ist – aber
    nur, wenn alle Fenster/Türen der Alarmzone zu sind. Ohne Tor-/Türöffnung nach
    30 min nur Erinnerung mit Taste «Jetzt scharf schalten». Testmodus: meldet nur.'
  triggers:
  - entity_id: alarm_control_panel.homematic_ip_hmip_alarm_control_panel
    from:
    - armed_home
    - armed_away
    to: disarmed
    trigger: state
  conditions:
  - after: '23:59:00'
    before: 04:55:00
    condition: time
    note: 'HmIP-Zeitplan: scharf 23:59:30, aus 05:00 – bei Änderung im HmIP hier anpassen'
  actions:
  - variables:
      zeit: '{{ now().strftime(''%H:%M'') }}'
  - action: script.push_matrix
    data:
      daten:
        actions:
        - action: ALARM_SCHARF
          authenticationRequired: true
          title: Jetzt scharf schalten
        tag: alarm_wieder_scharf
      text: Alarm um {{ zeit }} Uhr ausgeschaltet. Er wird 1 min nach dem Schliessen
        von Garagentor/Haustür automatisch wieder scharf.
      titel: "\U0001F513 Alarm nachts ausgeschaltet"
      meldung: alarm_wiederscharf
  - continue_on_timeout: true
    timeout: 00:30:00
    wait_for_trigger:
    - entity_id: binary_sensor.tore_und_haustur
      to: 'on'
      trigger: state
  - if:
    - '{{ wait.trigger is none }}'
    then:
    - action: script.push_matrix
      data:
        daten:
          actions:
          - action: ALARM_SCHARF
            authenticationRequired: true
            title: Jetzt scharf schalten
          tag: alarm_wieder_scharf
        text: Der Alarm ist seit 30 min ausgeschaltet und wird nicht automatisch scharf
          (kein Tor/keine Haustür bedient).
        titel: ⏰ Alarm ist noch aus
        meldung: alarm_wiederscharf
    - stop: Keine Tor-/Türöffnung – nur erinnert
  - continue_on_timeout: true
    timeout: 02:00:00
    wait_for_trigger:
    - entity_id: binary_sensor.tore_und_haustur
      for: 00:01:00
      to: 'off'
      trigger: state
  - if:
    - '{{ wait.trigger is none }}'
    then:
    - action: script.push_matrix
      data:
        text: Alarm bleibt ausgeschaltet.
        titel: ⚠️ Tor/Haustür seit 2 h offen
        meldung: alarm_wiederscharf
    - stop: Tor/Haustür blieb offen
  - condition: state
    entity_id: alarm_control_panel.homematic_ip_hmip_alarm_control_panel
    note: Inzwischen schon von Hand scharf? Dann nichts tun
    state: disarmed
  - after: '23:59:00'
    before: 05:00:00
    condition: time
  - if:
    - condition: state
      entity_id: binary_sensor.alarmzone_fenster_und_turen
      state: 'on'
    then:
    - action: script.push_matrix
      data:
        daten:
          actions:
          - action: ALARM_SCHARF
            authenticationRequired: true
            title: Jetzt scharf schalten
          tag: alarm_wieder_scharf
        text: 'Noch offen: {{ expand(''binary_sensor.alarmzone_fenster_und_turen'')
          | selectattr(''state'', ''eq'', ''on'') | map(attribute=''name'') | join('',
          '') }}.'
        titel: ⚠️ Alarm NICHT wieder scharf
        meldung: alarm_wiederscharf
    - stop: Fenster/Tür der Alarmzone offen
  - else:
    - action: alarm_control_panel.alarm_arm_home
      target:
        entity_id: alarm_control_panel.homematic_ip_hmip_alarm_control_panel
    - action: script.push_matrix
      data:
        daten:
          tag: alarm_wieder_scharf
        text: Hüllschutz um {{ now().strftime('%H:%M') }} Uhr automatisch wieder scharf
          geschaltet.
        titel: "\U0001F512 Alarm wieder scharf"
        meldung: alarm_wiederscharf
    if:
    - condition: state
      entity_id: input_boolean.alarm_tore_testmodus
      state: 'on'
    then:
    - action: script.push_matrix
      data:
        daten:
          tag: alarm_wieder_scharf
        text: Alles seit 1 min zu – im Scharfbetrieb würde der Alarm jetzt ({{ now().strftime('%H:%M')
          }} Uhr) wieder scharf geschaltet.
        titel: "\U0001F9EA Test: Alarm wäre wieder scharf"
        meldung: alarm_wiederscharf
  mode: restart
- id: '1795292506820'
  alias: Sofalampe – Shelly-Button
  description: Shelly Button1 steuert den Sofalampe-Dimmer direkt (Ersatz für den
    nicht erreichbaren Shelly i3). Einfach = ein, Doppel = aus, Lang = umschalten.
  triggers:
  - event_data:
      channel: 1
      click_type: single
      device: shellybutton1-98CDAC2DB0FF
    event_type: shelly.click
    id: single
    trigger: event
  - event_data:
      channel: 1
      click_type: double
      device: shellybutton1-98CDAC2DB0FF
    event_type: shelly.click
    id: double
    trigger: event
  - event_data:
      channel: 1
      click_type: long
      device: shellybutton1-98CDAC2DB0FF
    event_type: shelly.click
    id: long
    trigger: event
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: single
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.shellydimmer2_e8db84d2e240
    - conditions:
      - condition: trigger
        id: double
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.shellydimmer2_e8db84d2e240
    - conditions:
