title: FBH Heizungsraum
icon: mdi:thermometer-lines
views:

  # ═══════════════════════════════════════════════════════════
  # VIEW 1: ÜBERSICHT FBH
  # ═══════════════════════════════════════════════════════════
  - title: FBH Übersicht
    path: fbh-uebersicht
    icon: mdi:thermometer-lines
    cards:

      # ── Heizkreis Status oben ──────────────────────────────
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: WW Oben
            secondary: "{{ states('sensor.ww_mitte_rl_ist_ww_oben_temperatur_3') | float(0) | round(1) }} °C"
            icon: mdi:water-thermometer
            icon_color: >
              {% set t = states('sensor.ww_mitte_rl_ist_ww_oben_temperatur_3') | float(0) %}
              {% if t >= 55 %}red{% elif t >= 45 %}orange{% else %}blue{% endif %}
            layout: vertical
            card_mod:
              style: "ha-card { border-left: 3px solid #ef4444; }"
          - type: custom:mushroom-template-card
            primary: WW Mitte
            secondary: "{{ states('sensor.ww_mitte_rl_ist_ww_oben_temperatur') | float(0) | round(1) }} °C"
            icon: mdi:thermometer-water
            icon_color: >
              {% set t = states('sensor.ww_mitte_rl_ist_ww_oben_temperatur') | float(0) %}
              {% if t >= 50 %}red{% elif t >= 40 %}orange{% else %}blue{% endif %}
            layout: vertical
          - type: custom:mushroom-template-card
            primary: RL Ist
            secondary: "{{ states('sensor.ww_mitte_rl_ist_ww_oben_temperatur_2') | float(0) | round(1) }} °C"
            icon: mdi:thermometer-chevron-down
            icon_color: blue
            layout: vertical
          - type: custom:mushroom-template-card
            primary: VL HK-II
            secondary: "{{ states('sensor.16_waku_rl_hk_ii_vl_hk_ii_temperatur_3') | float(0) | round(1) }} °C"
            icon: mdi:thermometer-chevron-up
            icon_color: orange
            layout: vertical
          - type: custom:mushroom-template-card
            primary: RL HK-II
            secondary: "{{ states('sensor.16_waku_rl_hk_ii_vl_hk_ii_temperatur_2') | float(0) | round(1) }} °C"
            icon: mdi:thermometer-chevron-down
            icon_color: cyan
            layout: vertical
          - type: custom:mushroom-template-card
            primary: WaKü
            secondary: "{{ states('sensor.16_waku_rl_hk_ii_vl_hk_ii_temperatur') | float(0) | round(1) }} °C"
            icon: mdi:water-pump
            icon_color: blue
            layout: vertical

      # ── Grafik Speicher & Heizkreis (Plotly, Aufbau wie «PV Produktion heute» im Solar Manager) ──
      # Ziehen = Zoom, Doppelklick = zurück; türkis = WP-Leistung (rechte Achse)
      - type: custom:plotly-graph
        hours_to_show: 24
        refresh_interval: 60
        layout:
          height: 470
          margin:
            t: 95
            b: 120
            l: 45
            r: 50
          paper_bgcolor: "rgba(0,0,0,0)"
          plot_bgcolor: "rgba(0,0,0,0)"
          font:
            color: "#9e9e9e"
            size: 11
          xaxis:
            showgrid: false
            color: "#9e9e9e"
            tickformat: "%H:%M"
          yaxis:
            showgrid: true
            gridcolor: "#2a2a2a"
            color: "#9e9e9e"
            ticksuffix: "°"
            range: [15, 60]
            fixedrange: true
          yaxis2:
            overlaying: "y"
            side: right
            visible: true
            showgrid: false
            color: "#06b6d4"
            tickformat: "~s"
            ticksuffix: "W"
            range: [0, 7000]
            fixedrange: true
          showlegend: true
          legend:
            orientation: h
            x: 0
            xanchor: left
            "y": -0.09
            yanchor: top
            font:
              size: 10
          annotations:
            - text: "Speicher & Heizkreis"
              xref: paper
              yref: paper
              x: 0
              "y": 1.13
              xanchor: left
              yanchor: bottom
              showarrow: false
              font:
                size: 20
                color: "#9e9e9e"
            - text: |
                $fn ({hass}) => 'Warmwasser ' + (Math.round((parseFloat(hass.states['sensor.ww_mitte_rl_ist_ww_oben_temperatur_3'].state)||0)*10)/10).toFixed(1) + ' °C'
              xref: paper
              yref: paper
              x: 0
              "y": 1.05
              xanchor: left
              yanchor: bottom
              showarrow: false
              font:
                size: 14
                color: "#ef4444"
            - text: |
                $fn ({hass}) => 'WP ' + Math.round(parseFloat(hass.states['sensor.energy_manager_wp_aktuell_w'].state)||0) + ' W'
              xref: paper
              yref: paper
              x: 0
              "y": 1.0
              xanchor: left
              yanchor: bottom
              showarrow: false
              font:
                size: 11
                color: "#06b6d4"
        entities:
          - entity: sensor.energy_manager_wp_aktuell_w
            name: WP Leistung
            yaxis: "y2"
            fill: tozeroy
            fillcolor: "rgba(6,182,212,0.15)"
            line:
              color: "rgba(6,182,212,0.5)"
              width: 0.5
              shape: hv
          - entity: sensor.ww_mitte_rl_ist_ww_oben_temperatur_3
            name: Warmwasser
            yaxis: "y"
            line:
              color: "#ef4444"
              width: 2
          - entity: sensor.ww_mitte_rl_ist_ww_oben_temperatur
            name: WW mitte
            yaxis: "y"
            line:
              color: "#f97316"
              width: 2
          - entity: sensor.ww_mitte_rl_ist_ww_oben_temperatur_2
            name: RL Ist WP
            yaxis: "y"
            line:
              color: "#3b82f6"
              width: 1.5
          - entity: sensor.16_waku_rl_hk_ii_vl_hk_ii_temperatur_3
            name: VL HK-II
            yaxis: "y"
            line:
              color: "#f59e0b"
              width: 1.2
          - entity: sensor.16_waku_rl_hk_ii_vl_hk_ii_temperatur_2
            name: RL HK-II
            yaxis: "y"
            line:
              color: "#06b6d4"
              width: 1.2

      # ── FBH Räume Grid (Rücklauf-Fühler je Strang) ──
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Erdgeschoss"
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Küche
                secondary: "{{ states('sensor.shelly1_8caab55d7ecf_temperatur') | float(0) | round(1) }} °C"
                icon: mdi:stove
                icon_color: >
                  {% set t = states('sensor.shelly1_8caab55d7ecf_temperatur') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Wohnen 1
                secondary: "{{ states('sensor.shelly1_8caab561c0b7_temperatur_2') | float(0) | round(1) }} °C"
                icon: mdi:sofa
                icon_color: >
                  {% set t = states('sensor.shelly1_8caab561c0b7_temperatur_2') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Wohnen 2
                secondary: "{{ states('sensor.shelly1_8caab55d7ecf_temperatur_2') | float(0) | round(1) }} °C"
                icon: mdi:sofa-outline
                icon_color: >
                  {% set t = states('sensor.shelly1_8caab55d7ecf_temperatur_2') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Wohnen 3
                secondary: "{{ states('sensor.shelly1_8caab55d7ecf_temperatur_3') | float(0) | round(1) }} °C"
                icon: mdi:sofa-single
                icon_color: >
                  {% set t = states('sensor.shelly1_8caab55d7ecf_temperatur_3') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Essen
                secondary: "{{ states('sensor.shelly1_8caab56147d3_temperatur') | float(0) | round(1) }} °C"
                icon: mdi:silverware-fork-knife
                icon_color: >
                  {% set t = states('sensor.shelly1_8caab56147d3_temperatur') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Spielen
                secondary: "{{ states('sensor.shelly1_8caab56147d3_temperatur_2') | float(0) | round(1) }} °C"
                icon: mdi:toy-brick
                icon_color: >
                  {% set t = states('sensor.shelly1_8caab56147d3_temperatur_2') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Gäste WC
                secondary: "{{ states('sensor.shelly1_8caab56147d3_temperatur_3') | float(0) | round(1) }} °C"
                icon: mdi:toilet
                icon_color: >
                  {% set t = states('sensor.shelly1_8caab56147d3_temperatur_3') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Entrée
                secondary: "{{ states('sensor.shelly1_8caab561c0b7_temperatur') | float(0) | round(1) }} °C"
                icon: mdi:door-open
                icon_color: >
                  {% set t = states('sensor.shelly1_8caab561c0b7_temperatur') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Obergeschoss"
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Galerie
                secondary: "{{ states('sensor.shelly1_8caab561c0b7_temperatur_3') | float(0) | round(1) }} °C"
                icon: mdi:stairs
                icon_color: >
                  {% set t = states('sensor.shelly1_8caab561c0b7_temperatur_3') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Eltern
                secondary: "{{ states('sensor.shelly1_c45bbe570c30_temperatur') | float(0) | round(1) }} °C"
                icon: mdi:bed-king
                icon_color: >
                  {% set t = states('sensor.shelly1_c45bbe570c30_temperatur') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Dusche
                secondary: "{{ states('sensor.shelly1_c45bbe570c30_temperatur_2') | float(0) | round(1) }} °C"
                icon: mdi:shower
                icon_color: >
                  {% set t = states('sensor.shelly1_c45bbe570c30_temperatur_2') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Yanik
                secondary: "{{ states('sensor.shelly1_8caab55d7177_temperatur') | float(0) | round(1) }} °C"
                icon: mdi:bed-single
                icon_color: >
                  {% set t = states('sensor.shelly1_8caab55d7177_temperatur') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Bad
                secondary: "{{ states('sensor.shelly1_8caab55d7177_temperatur_2') | float(0) | round(1) }} °C"
                icon: mdi:bathtub-outline
                icon_color: >
                  {% set t = states('sensor.shelly1_8caab55d7177_temperatur_2') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Mael
                secondary: "{{ states('sensor.shelly1_8caab55d7177_temperatur_3') | float(0) | round(1) }} °C"
                icon: mdi:bed-single-outline
                icon_color: >
                  {% set t = states('sensor.shelly1_8caab55d7177_temperatur_3') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Untergeschoss"
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Hobby
                secondary: "{{ states('sensor.shelly1_c45bbe570c30_temperatur_3') | float(0) | round(1) }} °C"
                icon: mdi:radiator
                icon_color: >
                  {% set t = states('sensor.shelly1_c45bbe570c30_temperatur_3') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical
              - type: custom:mushroom-template-card
                primary: WaKü
                secondary: "{{ states('sensor.16_waku_rl_hk_ii_vl_hk_ii_temperatur') | float(0) | round(1) }} °C"
                icon: mdi:washing-machine
                icon_color: >
                  {% set t = states('sensor.16_waku_rl_hk_ii_vl_hk_ii_temperatur') | float(0) %}
                  {% if t >= 24 %}red{% elif t >= 21 %}green{% else %}blue{% endif %}
                layout: vertical

      # ── Grafik FBH-Strang-Rückläufe (Fühler am Rücklauf jedes Heizstrangs, Namen = Räume; Hobby = Radiator) ──
      - type: custom:plotly-graph
        hours_to_show: 24
        refresh_interval: 120
        layout:
          height: 560
          margin:
            t: 80
            b: 175
            l: 45
            r: 10
          paper_bgcolor: "rgba(0,0,0,0)"
          plot_bgcolor: "rgba(0,0,0,0)"
          font:
            color: "#9e9e9e"
            size: 11
          xaxis:
            showgrid: false
            color: "#9e9e9e"
            tickformat: "%H:%M"
          yaxis:
            showgrid: true
            gridcolor: "#2a2a2a"
            color: "#9e9e9e"
            ticksuffix: "°"
            range: [19, 37]
          yaxis2:
            overlaying: "y"
            visible: false
            range: [0, 1]
            fixedrange: true
          showlegend: true
          legend:
            orientation: h
            x: 0
            xanchor: left
            "y": -0.07
            yanchor: top
            font:
              size: 10
          annotations:
            - text: "FBH-Stränge Rücklauf (24 h)"
              xref: paper
              yref: paper
              x: 0
              "y": 1.1
              xanchor: left
              yanchor: bottom
              showarrow: false
              font:
                size: 20
                color: "#9e9e9e"
            - text: |
                $fn ({hass}) => 'RL HK-II ' + (Math.round((parseFloat(hass.states['sensor.16_waku_rl_hk_ii_vl_hk_ii_temperatur_2'].state)||0)*10)/10).toFixed(1) + '° · VL ' + (Math.round((parseFloat(hass.states['sensor.16_waku_rl_hk_ii_vl_hk_ii_temperatur_3'].state)||0)*10)/10).toFixed(1) + '°'
              xref: paper
              yref: paper
              x: 0
              "y": 1.02
              xanchor: left
              yanchor: bottom
              showarrow: false
              font:
                size: 12
                color: "#06b6d4"
        entities:
          - entity: switch.homematic_ip_fbh_pumpe_hk_ii
            name: FBH-Pumpe EIN
            yaxis: "y2"
            showlegend: false
            fill: tozeroy
            fillcolor: "rgba(34,197,94,0.07)"
            line:
              color: "rgba(34,197,94,0.25)"
              width: 0.5
              shape: hv
            filters:
              - map_y: 'y === "on" ? 1 : 0'
          - entity: sensor.shelly1_8caab55d7ecf_temperatur
            name: Küche
            yaxis: "y"
            line:
              color: "#ef4444"
              width: 1.2
          - entity: sensor.shelly1_8caab561c0b7_temperatur_2
            name: Wohnen 1
            yaxis: "y"
            line:
              color: "#f97316"
              width: 1.2
          - entity: sensor.shelly1_8caab55d7ecf_temperatur_2
            name: Wohnen 2
            yaxis: "y"
            line:
              color: "#f59e0b"
              width: 1.2
          - entity: sensor.shelly1_8caab55d7ecf_temperatur_3
            name: Wohnen 3
            yaxis: "y"
            line:
              color: "#eab308"
              width: 1.2
          - entity: sensor.shelly1_8caab56147d3_temperatur
            name: Essen
            yaxis: "y"
            line:
              color: "#22c55e"
              width: 1.2
          - entity: sensor.shelly1_8caab56147d3_temperatur_2
            name: Spielen
            yaxis: "y"
            line:
              color: "#06b6d4"
              width: 1.2
          - entity: sensor.shelly1_8caab56147d3_temperatur_3
            name: Gäste WC
            yaxis: "y"
            line:
              color: "#8b5cf6"
              width: 1.2
          - entity: sensor.shelly1_8caab561c0b7_temperatur
            name: Entrée
            yaxis: "y"
            line:
              color: "#ec4899"
              width: 1.2
          - entity: sensor.shelly1_8caab561c0b7_temperatur_3
            name: Galerie
            yaxis: "y"
            line:
              color: "#64748b"
              width: 1.2
          - entity: sensor.shelly1_c45bbe570c30_temperatur
            name: Eltern
            yaxis: "y"
            line:
              color: "#dc2626"
              width: 1.2
          - entity: sensor.shelly1_c45bbe570c30_temperatur_2
            name: Dusche
            yaxis: "y"
            line:
              color: "#3b82f6"
              width: 1.2
          - entity: sensor.shelly1_c45bbe570c30_temperatur_3
            name: Hobby (Radiator)
            yaxis: "y"
            line:
              color: "#16a34a"
              width: 1.2
          - entity: sensor.shelly1_8caab55d7177_temperatur
            name: Yanik
            yaxis: "y"
            line:
              color: "#d97706"
              width: 1.2
          - entity: sensor.shelly1_8caab55d7177_temperatur_2
            name: Bad
            yaxis: "y"
            line:
              color: "#a855f7"
              width: 1.2
          - entity: sensor.shelly1_8caab55d7177_temperatur_3
            name: Mael
            yaxis: "y"
            line:
              color: "#db2777"
              width: 1.2
          - entity: sensor.16_waku_rl_hk_ii_vl_hk_ii_temperatur_2
            name: RL HK-II gesamt
            yaxis: "y"
            line:
              color: "#ffffff"
              width: 3
          - entity: sensor.16_waku_rl_hk_ii_vl_hk_ii_temperatur_3
            name: VL HK-II
            yaxis: "y"
            line:
              color: "#f59e0b"
              width: 1.5
              dash: dash

      # ── Grafik Strang-Abgleich: Ø Abweichung jedes Strang-RL vom Mittel aller Stränge (letzte Nacht, eingeschwungen) ──
      # Quelle: SQL-Sensor sensor.fbh_strang_abweichung (packages/wp_nacht_kennzahlen.yaml); gleiche Grösse wie Excel Nacht_13_14 Spalte H
      # orange ≥ +0.4 K = eher viel Durchfluss · blau ≤ −0.4 K = eher wenig · grün = ok
      - type: custom:plotly-graph
        hours_to_show: 1
        refresh_interval: 300
        layout:
          height: 560
          margin:
            t: 80
            b: 40
            l: 115
            r: 20
          paper_bgcolor: "rgba(0,0,0,0)"
          plot_bgcolor: "rgba(0,0,0,0)"
          font:
            color: "#9e9e9e"
            size: 11
          xaxis:
            type: linear
            range: [-1.8, 1.8]
            ticksuffix: " K"
            dtick: 0.4
            showgrid: true
            gridcolor: "#2a2a2a"
            zeroline: true
            zerolinecolor: "#888888"
            color: "#9e9e9e"
          yaxis:
            type: category
            autorange: reversed
            color: "#cccccc"
          showlegend: false
          shapes:
            - type: rect
              xref: x
              yref: paper
              x0: -0.4
              x1: 0.4
              y0: 0
              y1: 1
              fillcolor: "rgba(34,197,94,0.07)"
              line:
                width: 0
          annotations:
            - text: "Strang-Abgleich Ø Abw."
              xref: paper
              yref: paper
              x: 0
              "y": 1.1
              xanchor: left
              yanchor: bottom
              showarrow: false
              font:
                size: 18
                color: "#9e9e9e"
            - text: |
                $fn ({hass}) => { const s = hass.states['sensor.fbh_strang_abweichung']; const a = (s || {}).attributes || {}; return a.fenster ? ('Nacht ' + a.fenster + ' · ' + s.state + ' Werte') : 'keine Daten (FBH-Pumpe lief letzte Nacht nicht eingeschwungen)'; }
              xref: paper
              yref: paper
              x: 0
              "y": 1.02
              xanchor: left
              yanchor: bottom
              showarrow: false
              font:
                size: 11
                color: "#22c55e"
        entities:
          - entity: ""
            name: Abweichung vom Mittel
            type: bar
            orientation: h
            yaxis: "y"
            "y": ["Küche", "Wohnen 1", "Wohnen 2", "Wohnen 3", "Essen", "Spielen", "Gäste WC", "Entrée", "Galerie", "Eltern", "Dusche", "Hobby (Radiator)", "Yanik", "Bad", "Mael", "RL HK-II gesamt"]
            x: |
              $ex (['kueche','wohnen1','wohnen2','wohnen3','essen','spielen','gaestewc','entree','galerie','eltern','dusche','hobby','yanik','bad','mael','rl_hk2']).map(k => { const a = (hass.states['sensor.fbh_strang_abweichung'] || {}).attributes || {}; return (typeof a[k] === 'number') ? a[k] : null; })
            text: |
              $ex (['kueche','wohnen1','wohnen2','wohnen3','essen','spielen','gaestewc','entree','galerie','eltern','dusche','hobby','yanik','bad','mael','rl_hk2']).map(k => { const a = (hass.states['sensor.fbh_strang_abweichung'] || {}).attributes || {}; return (typeof a[k] === 'number') ? a[k] : null; }).map(v => v === null ? '–' : (v > 0 ? '+' : '') + v.toFixed(2) + ' K')
            customdata: |
              $ex (['kueche','wohnen1','wohnen2','wohnen3','essen','spielen','gaestewc','entree','galerie','eltern','dusche','hobby','yanik','bad','mael','rl_hk2']).map(k => { const a = (hass.states['sensor.fbh_strang_abweichung'] || {}).attributes || {}; return (typeof a['hub_' + k] === 'number') ? a['hub_' + k] : null; })
            textposition: outside
            cliponaxis: false
            marker:
              color: |
