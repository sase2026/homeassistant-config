  # ═══════════════════════════════════════════════════════════
  # VIEW 6: TABELLE (Reports)
  # ═══════════════════════════════════════════════════════════
  - title: Tabelle
    path: reports
    icon: mdi:table
    cards:

      # ── 1. Toggle Push + Zeit ────────────────────────────────
      - type: entities
        title: Tagesabschluss Push-Meldung
        show_header_toggle: false
        entities:
          - entity: automation.boiler_tagesbericht
            name: Push aktiv
            icon: mdi:bell-ring
          - entity: input_datetime.tagesabschluss_push_zeit
            name: Push-Zeit

      # ── 2. Tageskennzahlen heute ─────────────────────────────
      - type: entities
        title: Tageskennzahlen heute
        show_header_toggle: false
        entities:
          - entity: sensor.energy_manager_pv_produktion_heute_kwh
            name: PV Produktion
            icon: mdi:solar-power-variant
          - entity: sensor.energy_manager_einspeisung_heute_kwh_2
            name: Einspeisung
            icon: mdi:transmission-tower-export
            format: precision1
          - entity: sensor.energy_manager_netzbezug_heute_kwh
            name: Netzbezug
            icon: mdi:transmission-tower-import
          - entity: sensor.energy_manager_hausverbrauch_heute_kwh
            name: Haus & WP Verbrauch
            icon: mdi:home-lightning-bolt
          - entity: sensor.energy_manager_pv_produktion_monat_kwh
            name: PV Produktion Monat
            icon: mdi:solar-power
          - entity: sensor.energy_manager_autarkiegrad_heute
            name: Autarkie heute
            icon: mdi:shield-sun
          - entity: sensor.energy_manager_eigenverbrauchsquote_heute
            name: Eigenverbrauch heute
            icon: mdi:home-percent
          - entity: sensor.energy_manager_autarkiegrad_monat
            name: Autarkie Monat
            icon: mdi:shield-sun-outline
          - entity: sensor.energy_manager_eigenverbrauchsquote_monat
            name: Eigenverbrauch Monat
            icon: mdi:home-percent-outline
          - entity: sensor.ww_mitte_rl_ist_ww_oben_temperatur_3
            name: Boilertemperatur
            icon: mdi:water-thermometer

      # ── Stromkosten ──────────────────────────────────────────
      - type: entities
        title: Energie-Kosten & Vergütung
        show_header_toggle: false
        entities:
          - type: section
            label: Netzbezug Kosten
          - entity: sensor.stromkosten_netzbezug_heute_chf
            name: Heute
            icon: mdi:cash-clock
          - entity: sensor.stromkosten_netzbezug_monat_chf
            name: Monat
            icon: mdi:cash-multiple
          - entity: sensor.stromkosten_netzbezug_jahr_chf
            name: Jahr
            icon: mdi:cash-check
          - type: section
            label: Einspeisevergütung
          - entity: sensor.einspeiseverguetung_heute_chf
            name: Heute
            icon: mdi:solar-power
          - entity: sensor.einspeiseverguetung_monat_chf
            name: Monat
            icon: mdi:solar-power-variant
          - entity: sensor.einspeiseverguetung_jahr_chf
            name: Jahr
            icon: mdi:solar-panel
          - type: section
            label: Nettostromkosten (Bezug minus Vergütung)
          - entity: sensor.nettostromkosten_heute_chf
            name: Heute
            icon: mdi:currency-usd
          - entity: sensor.nettostromkosten_monat_chf
            name: Monat
            icon: mdi:currency-usd
          - entity: sensor.nettostromkosten_jahr_chf
            name: Jahr
            icon: mdi:currency-usd

      # ── System Parameter ─────────────────────────────────────
      - type: entities
        title: Strompreise
        show_header_toggle: false
        entities:
          - entity: input_number.energy_manager_strompreis_hochtarif
            name: Hochtarif CHF/kWh
          - entity: input_number.energy_manager_strompreis_niedertarif
            name: Niedertarif CHF/kWh
          - entity: input_number.energy_manager_einspeiseverguetung
            name: Einspeisevergütung CHF/kWh

      - type: entities
        title: Tarifzeiten (Wochentag Mo-Fr)
        show_header_toggle: false
        entities:
          - entity: input_datetime.ht_beginn_wochentag
            name: HT Beginn
            icon: mdi:clock-start
          - entity: input_datetime.ht_ende_wochentag
            name: HT Ende
            icon: mdi:clock-end
          - type: section
            label: Sa + So ganztags Niedertarif. Einspeisung 24h/7d.

      # ── Reihe 1: Autarkie ──
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Autarkie heute
            secondary: "{{ states('sensor.energy_manager_autarkiegrad_heute') | float(0) | round(1) }} %"
            icon: mdi:shield-sun
            icon_color: >
              {% set a = states('sensor.energy_manager_autarkiegrad_heute') | float(0) %}
              {% if a >= 80 %}green{% elif a >= 50 %}amber{% else %}red{% endif %}
            layout: vertical
          - type: custom:mushroom-template-card
            primary: Autarkie Monat
            secondary: "{{ states('sensor.energy_manager_autarkiegrad_monat') | float(0) | round(1) }} %"
            icon: mdi:shield-sun-outline
            icon_color: >
              {% set a = states('sensor.energy_manager_autarkiegrad_monat') | float(0) %}
              {% if a >= 80 %}green{% elif a >= 50 %}amber{% else %}red{% endif %}
            layout: vertical
          - type: custom:mushroom-template-card
            primary: Autarkie Jahr
            secondary: "{{ states('sensor.energy_manager_autarkiegrad_jahr') | float(0) | round(1) }} %"
            icon: mdi:shield-check
            icon_color: >
              {% set a = states('sensor.energy_manager_autarkiegrad_jahr') | float(0) %}
              {% if a >= 80 %}green{% elif a >= 50 %}amber{% else %}red{% endif %}
            layout: vertical

      # ── Reihe 2: Eigenverbrauch ──
      - type: horizontal-stack
        cards:

          - type: custom:mushroom-template-card
            primary: Eigenverbrauch Monat
            secondary: "{{ states('sensor.energy_manager_eigenverbrauchsquote_monat') | float(0) | round(1) }} %"
            icon: mdi:home-percent-outline
            icon_color: green
            layout: vertical
          - type: custom:mushroom-template-card
            primary: Eigenverbrauch Jahr
            secondary: "{{ states('sensor.energy_manager_eigenverbrauchsquote_jahr') | float(0) | round(1) }} %"
            icon: mdi:home-percent
            icon_color: green
            layout: vertical

      # ── Grafik: PV-Produktion je Monat (ersetzt statistics-graph) ──
      - type: custom:plotly-graph
        hours_to_show: 1
        refresh_interval: 600
        layout:
          height: 360
          barmode: group
          bargap: 0.25
          margin:
            t: 75
            b: 60
            l: 55
            r: 10
          paper_bgcolor: "rgba(0,0,0,0)"
          plot_bgcolor: "rgba(0,0,0,0)"
          font:
            color: "#9e9e9e"
            size: 11
          xaxis:
            type: category
            range: $ex [-0.5, JSON.parse(((hass.states['sensor.energie_tageswerte'] || {}).attributes || {}).monate || '[]').length - 0.5]
            color: "#9e9e9e"
            showgrid: false
          yaxis:
            showgrid: true
            gridcolor: "#2a2a2a"
            color: "#9e9e9e"
            ticksuffix: " kWh"
            zeroline: true
            zerolinecolor: "#666666"
          showlegend: true
          legend:
            orientation: h
            x: 0
            xanchor: left
            "y": -0.14
            yanchor: top
            font:
              size: 10
          annotations:
            - text: "PV-Produktion je Monat"
              xref: paper
              yref: paper
              x: 0
              "y": 1.13
              xanchor: left
              yanchor: bottom
              showarrow: false
              font:
                size: 20
                color: "#9e9e9e"
            - text: "kWh · Eigenverbrauch = PV − Einspeisung"
              xref: paper
              yref: paper
              x: 0
              "y": 1.04
              xanchor: left
              yanchor: bottom
              showarrow: false
              font:
                size: 11
                color: "#9e9e9e"
        entities:
          - entity: ""
            name: PV Produktion
            type: bar
            yaxis: "y"
            x: |
              $ex JSON.parse(((hass.states['sensor.energie_tageswerte'] || {}).attributes || {}).monate || '[]').map(r => ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][+r.p.slice(5) - 1] + ' ' + r.p.slice(2, 4))
            "y": |
              $ex JSON.parse(((hass.states['sensor.energie_tageswerte'] || {}).attributes || {}).monate || '[]').map(r => r.pv)
            marker:
              color: "#ff9800"
            hovertemplate: "%{x}: %{y:.0f}<extra>PV Produktion</extra>"
          - entity: ""
            name: Einspeisung
            type: bar
            yaxis: "y"
            x: |
              $ex JSON.parse(((hass.states['sensor.energie_tageswerte'] || {}).attributes || {}).monate || '[]').map(r => ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][+r.p.slice(5) - 1] + ' ' + r.p.slice(2, 4))
            "y": |
              $ex JSON.parse(((hass.states['sensor.energie_tageswerte'] || {}).attributes || {}).monate || '[]').map(r => r.ein)
            marker:
              color: "#7b1fa2"
            hovertemplate: "%{x}: %{y:.0f}<extra>Einspeisung</extra>"
          - entity: ""
            name: Eigenverbrauch
            type: bar
            yaxis: "y"
            x: |
              $ex JSON.parse(((hass.states['sensor.energie_tageswerte'] || {}).attributes || {}).monate || '[]').map(r => ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][+r.p.slice(5) - 1] + ' ' + r.p.slice(2, 4))
            "y": |
              $ex JSON.parse(((hass.states['sensor.energie_tageswerte'] || {}).attributes || {}).monate || '[]').map(r => (r.pv === null ? null : Math.round((r.pv - r.ein) * 10) / 10))
            marker:
              color: "#22c55e"
            hovertemplate: "%{x}: %{y:.0f}<extra>Eigenverbrauch</extra>"

      # ── Grafik: Verbrauch je Monat (ersetzt statistics-graph) ──
