      # ── 4. Tageswerte Langzeit (SQL-Sensor sensor.energie_tageswerte, packages/wp_nacht_kennzahlen.yaml) ──
      - type: markdown
        title: Tageswerte & Durchschnitte (Langzeit)
        content: |
          {% set s = 'sensor.energie_tageswerte' %}
          {% set raw = state_attr(s, 'tage') %}
          {% set t = raw | from_json if raw else [] %}
          {% macro f(v, d=1) %}{% if v is number %}{{ (v | round(d)) if d > 0 else (v | round(0) | int) }}{% else %}–{% endif %}{% endmacro %}
          **Letzte 14 Tage** (kWh) · Daten ab {{ state_attr(s, 'ab') or '–' }}

          | Tag | PV | Einsp. | Netzbezug | Haus | WP | Verbrauch | Autarkie | Eigenverbr. |
          |:--|--:|--:|--:|--:|--:|--:|--:|--:|
          {% for r in t -%}
          | {{ r.d[8:10] }}.{{ r.d[5:7] }}.{% if r.d == now().strftime('%Y-%m-%d') %} *(laufend)*{% endif %} | {{ f(r.pv) }} | {{ f(r.ein) }} | **{{ f(r.bez) }}** | {{ f(r.haus) }} | {{ f(r.wp) }} | {{ f(r.verbr) }} | {{ f(r.autarkie) }} % | {{ f(r.eigen) }} % |
          {% endfor %}

          **Durchschnitt pro Tag und Summen** (kWh)

          | Zeitraum | Tage | PV | Einsp. | Netzbezug | Haus | WP | Verbrauch | Autarkie | Eigenverbr. |
          |:--|--:|--:|--:|--:|--:|--:|--:|--:|--:|
          {% for key, label, mode in [('avg7','Ø letzte 7 Tage','avg'), ('avg30','Ø letzte 30 Tage','avg'), ('monat','Ø Monat bisher','avg'), ('vormonat','Ø Vormonat','avg'), ('jahr','Ø Jahr bisher','avg'), ('monat','Σ Monat bisher','sum'), ('vormonat','Σ Vormonat','sum'), ('jahr','Σ Jahr bisher','sum')] -%}
          {% set rr = state_attr(s, key) %}{% set a = rr | from_json if rr else {} %}{% set n = a.get('n') or 0 %}{% set q = (n if (mode == 'avg' and n > 0) else 1) -%}
          | {{ label }} | {{ n }} | {{ f(a.get('pv', 0) / q if a.get('pv') is number else none) }} | {{ f(a.get('ein', 0) / q if a.get('ein') is number else none) }} | **{{ f(a.get('bez', 0) / q if a.get('bez') is number else none) }}** | {{ f(a.get('haus', 0) / q if a.get('haus') is number else none) }} | {{ f(a.get('wp', 0) / q if a.get('wp') is number else none) }} | {{ f(a.get('verbr', 0) / q if a.get('verbr') is number else none) }} | {{ f(a.get('autarkie')) }} % | {{ f(a.get('eigen')) }} % |
          {% endfor %}

          {% set pht = states('input_number.energy_manager_strompreis_hochtarif') | float(0) %}{% set pnt = states('input_number.energy_manager_strompreis_niedertarif') | float(0) %}{% set pev = states('input_number.energy_manager_einspeiseverguetung') | float(0) -%}
          **Energiekosten** (CHF, aktuelle Tarife: HT {{ pht }} · NT {{ pnt }} · Vergütung {{ pev }} CHF/kWh)

          | Tag / Zeitraum | Bezug HT kWh | Bezug NT kWh | Kosten Bezug | Vergütung | **Netto** |
          |:--|--:|--:|--:|--:|--:|
          {% for r in t -%}
          {% set kb = (r.ht or 0) * pht + (r.nt or 0) * pnt %}{% set kv = (r.ein or 0) * pev -%}
          | {{ r.d[8:10] }}.{{ r.d[5:7] }}. | {{ f(r.ht) }} | {{ f(r.nt) }} | {{ f(kb, 2) }} | {{ f(kv, 2) }} | **{{ f(kb - kv, 2) }}** |
          {% endfor -%}
          {% for key, label, mode in [('avg7','Ø/Tag letzte 7 Tage','avg'), ('avg30','Ø/Tag letzte 30 Tage','avg'), ('monat','Σ Monat bisher','sum'), ('vormonat','Σ Vormonat','sum'), ('jahr','Σ Jahr bisher','sum')] -%}
          {% set rr = state_attr(s, key) %}{% set a = rr | from_json if rr else {} %}{% set n = a.get('n') or 0 %}{% set q = (n if (mode == 'avg' and n > 0) else 1) %}{% set kb = ((a.get('ht') or 0) * pht + (a.get('nt') or 0) * pnt) / q %}{% set kv = (a.get('ein') or 0) * pev / q -%}
          | *{{ label }}* | {{ f((a.get('ht') or 0) / q) }} | {{ f((a.get('nt') or 0) / q) }} | {{ f(kb, 2) }} | {{ f(kv, 2) }} | **{{ f(kb - kv, 2) }}** |
          {% endfor %}

          <sub>Quelle: HA-Langzeitstatistik (Stundenwerte, dauerhaft) – Tageswert = Zählerstand Tagesende − Vortag. Netzbezug = Saldierungs-Zähler (Netzanschluss). Autarkie = (PV − Einspeisung) / Verbrauch · Eigenverbrauch = (PV − Einspeisung) / PV. Jahr ab 29.01.2026 (Beginn Statistik). Laufender Tag hinkt bis 1 h nach. Kosten: HT Mo–Fr 06–21 Uhr (Feiertage nicht berücksichtigt), mit den aktuell eingestellten Tarifen gerechnet.</sub>

  # ═══════════════════════════════════════════════════════════
  # VIEW 7: KENNZAHLEN (WP letzte Nacht vs. Vornacht, SQL-Sensoren aus packages/wp_nacht_kennzahlen.yaml)
  # ═══════════════════════════════════════════════════════════
  - title: Kennzahlen
    path: kennzahlen
    icon: mdi:clipboard-text-clock
    cards:
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: WP-Strom Nacht
            secondary: "{{ state_attr('sensor.wp_nacht_kennzahlen', 'strom_kwh') if state_attr('sensor.wp_nacht_kennzahlen', 'strom_kwh') is not none else '–' }} kWh"
            icon: mdi:heat-pump
            icon_color: "#06b6d4"
            layout: vertical
          - type: custom:mushroom-template-card
            primary: WW-Ladungen
            secondary: "{{ state_attr('sensor.wp_nacht_kennzahlen', 'ww_ladungen') if state_attr('sensor.wp_nacht_kennzahlen', 'ww_ladungen') is not none else '–' }} "
            icon: mdi:water-boiler
            icon_color: "#ef4444"
            layout: vertical
          - type: custom:mushroom-template-card
            primary: Anteil WW
            secondary: "{{ state_attr('sensor.wp_nacht_kennzahlen', 'ww_anteil_pct') if state_attr('sensor.wp_nacht_kennzahlen', 'ww_anteil_pct') is not none else '–' }} %"
            icon: mdi:percent
            icon_color: "#f97316"
            layout: vertical
          - type: custom:mushroom-template-card
            primary: Heiz-Takte
            secondary: "{{ state_attr('sensor.wp_nacht_kennzahlen', 'heiz_takte') if state_attr('sensor.wp_nacht_kennzahlen', 'heiz_takte') is not none else '–' }} "
            icon: mdi:sync
            icon_color: "#22c55e"
            layout: vertical
          - type: custom:mushroom-template-card
            primary: unter VL min.
            secondary: "{{ state_attr('sensor.wp_nacht_kennzahlen', 'mitte_min') if state_attr('sensor.wp_nacht_kennzahlen', 'mitte_min') is not none else '–' }} °C"
            icon: mdi:thermometer-water
            icon_color: "#f59e0b"
            layout: vertical
      - type: markdown
        title: Kennzahlen Nacht im Vergleich zur Vornacht
        content: |
          {% set a = states.sensor.wp_nacht_kennzahlen.attributes if states.sensor.wp_nacht_kennzahlen is not none else {} %}
          {% set b = states.sensor.wp_vornacht_kennzahlen.attributes if states.sensor.wp_vornacht_kennzahlen is not none else {} %}
          {% macro f(v, d) %}{% if v is number %}{{ (v | round(d)) if d > 0 else (v | round(0) | int) }}{% else %}–{% endif %}{% endmacro %}
          {% macro row(l, k, u, d, n) -%}
          {%- set x = a.get(k) %}{% set y = b.get(k) -%}
          | {{ l }} | **{{ f(x, d) }}** {{ u }} | {{ f(y, d) }} {{ u }} | {% if x is number and y is number %}{{ '+' if x - y > 0 else '' }}{{ f(x - y, d) }}{% else %}–{% endif %} | {{ n }} |
          {%- endmacro %}
          | Kennzahl | Nacht {{ a.get('nacht', '–') }} | Vornacht {{ b.get('nacht', '–') }} | Δ | Bemerkung |
          |:--|--:|--:|--:|:--|
          {{ row('WP-Strom Nacht', 'strom_kwh', 'kWh', 1, '') }}
          {{ row('davon im WW-Modus', 'ww_kwh', 'kWh', 1, '') }}
          {{ row('Anteil WP-Strom im WW-Modus', 'ww_anteil_pct', '%', 0, 'Nov.-Schnitt vor Fühler-Umstecken ≈ 46 %') }}
          {{ row('WW-Ladungen', 'ww_ladungen', '', 0, 'Ziel nachts: 0') }}
          {{ row('Laufzeit WW-Modus', 'ww_h', 'h', 1, '') }}
          {{ row('Heiz-Takte', 'heiz_takte', '', 0, '') }}
          {{ row('Laufzeit Heizbetrieb', 'heiz_h', 'h', 1, '') }}
          {{ row('FBH aktiv (Spreizung > 2.5 K)', 'fbh_aktiv_h', 'h', 1, '') }}
          {{ row('FBH-Pumpe EIN (Leistung > 10 W)', 'pumpe_h', 'h', 1, '') }}
          {{ row('RL Ist WP max. im Betrieb', 'rl_max_betrieb', '°C', 1, 'WW ab 38 °C') }}
          {{ row('Speicher unter VL min.', 'mitte_min', '°C', 1, 'Fühler 10 cm unter VL (ab 16.11.)') }}
          {{ row('Speicher oben min.', 'oben_min', '°C', 1, 'Zapfzone') }}
          {{ row('Ø Δ Mitte, WP aus + FBH läuft', 'dmitte_aus_fbh', 'K/h', 2, 'Wärmeentzug durch FBH') }}
          {{ row('Ø Δ Mitte, WP heizt + FBH läuft', 'dmitte_heiz_fbh', 'K/h', 2, '< 0 = Mitte kühlt trotz Heizbetrieb') }}
          {{ row('Ø Δ Mitte, FBH steht', 'dmitte_fbh_steht', 'K/h', 2, 'Verluste + Zapfung') }}
          {{ row('Ø Δ Oben, ganze Nacht', 'doben', 'K/h', 2, '') }}
          {{ row('Aussen min.', 'aussen_min', '°C', 1, 'Homematic') }}
          {{ row('Aussen Ø', 'aussen_mittel', '°C', 1, '') }}
          | Speicher unter VL 18:00 → 08:00 | **{{ f(a.get('mitte_start'),1) }} → {{ f(a.get('mitte_ende'),1) }}** °C | {{ f(b.get('mitte_start'),1) }} → {{ f(b.get('mitte_ende'),1) }} °C | | |
          | Speicher oben 18:00 → 08:00 | **{{ f(a.get('oben_start'),1) }} → {{ f(a.get('oben_ende'),1) }}** °C | {{ f(b.get('oben_start'),1) }} → {{ f(b.get('oben_ende'),1) }} °C | | |
          | Innen 18:00 → 08:00 | **{{ f(a.get('innen_start'),1) }} → {{ f(a.get('innen_ende'),1) }}** °C | {{ f(b.get('innen_start'),1) }} → {{ f(b.get('innen_ende'),1) }} °C | | |
          | FBH-Pumpe erstmals EIN | **{{ a.get('pumpe_ein') or '–' }}** | {{ b.get('pumpe_ein') or '–' }} | | |

          <sub>Nacht = 18:00–08:00, 5-min-Mittel der HA-Kurzzeitstatistik (ca. 10 Tage). Zustand: Aus < 200 W · WW = WP läuft und RL Ist ≥ 38 °C · sonst Heizen. Gleiche Logik wie Excel-Blatt «Nacht_13_14», Abschnitt A. Homematic-Werte (Pumpe, Aussen, Innen) ab 13.11.2026 23:00.</sub>
