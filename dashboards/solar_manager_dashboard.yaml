            fillcolor: "rgba(239,68,68,0.15)"
            line:
              color: "rgba(239,68,68,0.9)"
              width: 0.4
            filters:
              - map_y: 'Math.max(0, parseFloat(y))'
          - entity: sensor.leistung_saldierung
