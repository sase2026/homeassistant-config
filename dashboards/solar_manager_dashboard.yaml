              xanchor: left
              yanchor: bottom
              showarrow: false
              font:
                size: 20
                color: "#9e9e9e"
            - text: |
                $fn ({hass}) => { const v = Math.round(parseFloat(hass.states['sensor.leistung_saldierung'].state)||0); return (v >= 0 ? 'Bezug ' : 'Einspeisung ') + Math.abs(v) + ' W'; }
